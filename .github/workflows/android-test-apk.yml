name: Publish Android release APK

# The privileged build only checks out a successful main-branch CI commit.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    # Ignore CI runs from PR branches; only main push CI can publish an APK.
    branches: [main]
  workflow_dispatch:
    inputs:
      tdlib_source_run_id:
        description: "Optional official-source TDLib run ID, manual APK only"
        required: false
        type: string
        default: ""
      tdlib_archive_sha256:
        description: "SHA-256 of official-tdlib-jsonjava-android.tar.gz; both inputs or neither"
        required: false
        type: string
        default: ""

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Signed standalone APK
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    # Only eligible main builds enter the queue; PR workflow_run events cannot replace pending releases.
    concurrency:
      group: android-test-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # The Whisper runtime (react-native-executorch) compiles a large C++ library.
    timeout-minutes: 90
    env:
      # Phones are arm64; skipping emulator ABIs halves native compile time.
      ORG_GRADLE_PROJECT_reactNativeArchitectures: arm64-v8a
      RNET_TARGET: android-arm64-v8a
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 768M
      # Stable Android identity. Ignore mutable repository Actions Variables.
      PIA_ANDROID_PACKAGE: com.persai.app
      TARGET_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
    steps:
      - name: Checkout the tested main commit (no persisted credentials)
        uses: actions/checkout@v4
        with:
          ref: ${{ env.TARGET_SHA }}
          # Need all ancestors to compare against the commit of the last published APK.
          fetch-depth: 0
          persist-credentials: false

      - name: Verify current main and successful CI on this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$TARGET_SHA"
          main_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$main_sha" != "$TARGET_SHA" ]; then
            echo "Main has advanced. Skip publishing a stale APK."
            exit 1
          fi
          # For workflow_run, verify the trusted triggering CI event directly:
          # avoid the old redundant gh --jq lookup that caused a false-negative.
          # Manual dispatch independently checks the GitHub Actions runs API.
          node mobile/scripts/verify-main-ci.cjs

      - name: Verify optional manual TDLib release selection
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          TDLIB_SOURCE_RUN_ID: ${{ inputs.tdlib_source_run_id }}
          TDLIB_ARCHIVE_SHA256: ${{ inputs.tdlib_archive_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$TDLIB_SOURCE_RUN_ID" && -z "$TDLIB_ARCHIVE_SHA256" ]]; then
            echo "Ordinary APK: TDLib remains disabled"
          elif [[ "$TDLIB_SOURCE_RUN_ID" =~ ^[1-9][0-9]{0,14}$ &&
                  "$TDLIB_ARCHIVE_SHA256" =~ ^[a-f0-9]{64}$ ]]; then
            echo "Explicit reviewed TDLib selected; source and checksum verified before staging"
          else
            echo "::error::Pass BOTH a source run ID and 64-character lowercase SHA-256, or neither"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Check cumulative Android changes since last published APK
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: node mobile/scripts/android-release-policy.cjs

      - name: Ensure Android release configuration is present
        if: steps.changes.outputs.needed == 'true'
        env:
          PIA_ANDROID_KEYSTORE_B64: ${{ secrets.PIA_ANDROID_KEYSTORE_B64 }}
          PIA_ANDROID_KEY_ALIAS: ${{ secrets.PIA_ANDROID_KEY_ALIAS }}
          PIA_ANDROID_STORE_PASSWORD: ${{ secrets.PIA_ANDROID_STORE_PASSWORD }}
          PIA_ANDROID_KEY_PASSWORD: ${{ secrets.PIA_ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for field in PIA_ANDROID_KEYSTORE_B64 PIA_ANDROID_KEY_ALIAS PIA_ANDROID_STORE_PASSWORD PIA_ANDROID_KEY_PASSWORD; do
            if [ -z "${!field:-}" ]; then
              echo "::error::Missing $field. See docs/RELEASE_APK.md."
              exit 1
            fi
          done

      - uses: actions/setup-java@v4
        if: steps.changes.outputs.needed == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle dependencies and reusable build outputs
        if: steps.changes.outputs.needed == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-read-only: false

      - name: Restore trusted arm64 C/C++ compiler cache
        if: steps.changes.outputs.needed == 'true'
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-persai-native-ccache-arm64-v8a-v1-${{ hashFiles('mobile/package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-persai-native-ccache-arm64-v8a-v1-${{ hashFiles('mobile/package-lock.json') }}-
      - name: Install and prepare optional C/C++ compiler cache
        if: steps.changes.outputs.needed == 'true'
        shell: bash
        run: bash mobile/scripts/setup-ci-ccache.sh

      - uses: android-actions/setup-android@v3
        if: steps.changes.outputs.needed == 'true'
        with:
          packages: platform-tools

      - name: Install exact JS dependencies (checks already passed in CI)
        if: steps.changes.outputs.needed == 'true'
        working-directory: mobile
        run: npm ci --no-audit --no-fund

      - name: Check shared Telegram API identity (no credential values in logs)
        if: steps.changes.outputs.needed == 'true'
        env:
          PERSAI_TELEGRAM_API_ID: ${{ secrets.PERSAI_TELEGRAM_API_ID }}
          PERSAI_TELEGRAM_API_HASH: ${{ secrets.PERSAI_TELEGRAM_API_HASH }}
        shell: bash
        run: |
          node - <<'NODE'
          const id=(process.env.PERSAI_TELEGRAM_API_ID||'').trim();
          const hash=(process.env.PERSAI_TELEGRAM_API_HASH||'').trim();
          if (!id && !hash) {
            console.log('Shared Telegram app identity not provisioned: legacy API fallback only.');
            process.exit(0);
          }
          if (!/^[1-9][0-9]{0,9}$/.test(id) || Number(id)>2147483647 ||
              !/^[0-9a-fA-F]{32}$/.test(hash)) {
            console.error('::error::Both valid PERSAI_TELEGRAM_API_ID and PERSAI_TELEGRAM_API_HASH secrets are required.');
            process.exit(1);
          }
          console.log('Shared PersAI Telegram identity will be bundled in this signed release.');
          NODE

      - name: Compute strictly increasing Android build number
        if: steps.changes.outputs.needed == 'true'
        id: version
        shell: bash
        run: |
          code=$((GITHUB_RUN_NUMBER * 100 + GITHUB_RUN_ATTEMPT))
          if [ "$GITHUB_RUN_ATTEMPT" -ge 100 ] || [ "$code" -gt 2100000000 ]; then
            echo "::error::Android versionCode limit exceeded."
            exit 1
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - name: Stage reviewed TDLib only for explicitly requested signed APK upgrade
        if: ${{ steps.changes.outputs.needed == 'true' && github.event_name == 'workflow_dispatch' && inputs.tdlib_source_run_id != '' }}
        working-directory: mobile
        env:
          GH_TOKEN: ${{ github.token }}
          TDLIB_SOURCE_RUN_ID: ${{ inputs.tdlib_source_run_id }}
          TDLIB_ARCHIVE_SHA256: ${{ inputs.tdlib_archive_sha256 }}
        shell: bash
        run: bash scripts/tdlib/stage-reviewed-run.sh

      - name: Generate standard PersAI Android project with SQLCipher and visual embeddings
        if: steps.changes.outputs.needed == 'true'
        working-directory: mobile
        env:
          PIA_ANDROID_RELEASE: 'true'
          PIA_ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
          # Application identity is injected only in trusted main APK builds.
          PERSAI_TELEGRAM_API_ID: ${{ secrets.PERSAI_TELEGRAM_API_ID }}
          PERSAI_TELEGRAM_API_HASH: ${{ secrets.PERSAI_TELEGRAM_API_HASH }}
          PIA_ANDROID_BUILD_SHA: ${{ env.TARGET_SHA }}
          PIA_VISION_EXPO_GATE: 'true'
        run: |
          gradle -p ../spikes/photo-83-1-android :probe:assembleDebug --no-daemon --stacktrace
          node scripts/stage-vision-expo-gate.cjs prepare
          npx expo prebuild --platform android --no-install --clean
          node scripts/stage-vision-expo-gate.cjs inject
          test -s modules/persai-vision/android/libs/vision-engine.aar
          grep -q 'PersAI #83.2 Expo native inference ABI CI gate' android/app/build.gradle
          grep -q 'android:usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml
          node scripts/prepare-android-release.cjs

      - name: Restore signing key outside repository
        if: steps.changes.outputs.needed == 'true'
        env:
          PIA_ANDROID_KEYSTORE_B64: ${{ secrets.PIA_ANDROID_KEYSTORE_B64 }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$PIA_ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/pia-release.jks"
          test -s "$RUNNER_TEMP/pia-release.jks"

      - name: Compile and sign standalone release APK
        if: steps.changes.outputs.needed == 'true'
        working-directory: mobile/android
        env:
          # Expo rebuilds the JS bundle during Gradle; retain the same config as prebuild.
          PIA_ANDROID_RELEASE: 'true'
          PIA_ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
          # Application identity is injected only in trusted main APK builds.
          PERSAI_TELEGRAM_API_ID: ${{ secrets.PERSAI_TELEGRAM_API_ID }}
          PERSAI_TELEGRAM_API_HASH: ${{ secrets.PERSAI_TELEGRAM_API_HASH }}
          PIA_ANDROID_BUILD_SHA: ${{ env.TARGET_SHA }}
          PIA_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/pia-release.jks
          PIA_ANDROID_KEY_ALIAS: ${{ secrets.PIA_ANDROID_KEY_ALIAS }}
          PIA_ANDROID_STORE_PASSWORD: ${{ secrets.PIA_ANDROID_STORE_PASSWORD }}
          PIA_ANDROID_KEY_PASSWORD: ${{ secrets.PIA_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "${PERSAI_CCACHE_BIN:-}" ]; then
            ./gradlew :app:assembleRelease --init-script ../scripts/ci-native-ccache.init.gradle --build-cache --no-configuration-cache --no-daemon --stacktrace
          else
            echo "::warning::Signed APK compiling without optional ccache due to Ubuntu mirror failure"
            ./gradlew :app:assembleRelease --build-cache --no-configuration-cache --no-daemon --stacktrace
          fi

      - name: Verify compiler cache wiring when available
        if: steps.changes.outputs.needed == 'true'
        working-directory: mobile
        run: |
          if [ -n "${PERSAI_CCACHE_BIN:-}" ]; then
            node scripts/verify-native-ccache.cjs
            ccache --show-stats
          else
            echo "::warning::Compiler cache unavailable; signed APK compiled normally"
          fi

      - name: Verify APK, embedded JS and signing certificate
        if: steps.changes.outputs.needed == 'true'
        id: artifact
        working-directory: mobile
        env:
          PIA_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/pia-release.jks
          PIA_ANDROID_KEY_ALIAS: ${{ secrets.PIA_ANDROID_KEY_ALIAS }}
          PIA_ANDROID_STORE_PASSWORD: ${{ secrets.PIA_ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          unzip -t "$apk" >/dev/null
          unzip -Z1 "$apk" | grep -Fx 'assets/index.android.bundle'
          aapt_bin="$(find "$ANDROID_HOME/build-tools" -name aapt -type f | sort -V | tail -n 1)"
          "$aapt_bin" dump badging "$apk" | grep -Fq "package: name='com.persai.app'"
          # Test the user-upgradable com.persai.app, not a separate lab APK.
          dex_list="$(unzip -Z1 "$apk" | grep -E '^classes[0-9]*[.]dex$')"
          test -n "$dex_list"
          found=0
          while IFS= read -r dex; do
            if unzip -p "$apk" "$dex" | strings | grep -q 'VisionInteropApi'; then
              found=1
              break
            fi
          done <<< "$dex_list"
          test "$found" -eq 1 || { echo "::error::Vision ABI missing from signed PersAI APK"; exit 1; }
          if unzip -Z1 "$apk" | grep -Eq '[.]litertlm$'; then
            echo "::error::Model weights bundled without consent"; exit 1
          fi
          # On-device Whisper: the ExecuTorch runtime and its CPU backend are packaged.
          for lib in libRnExecutorch.so libexecutorch.so libxnnpack_executorch_backend.so; do
            unzip -Z1 "$apk" | grep -Fx "lib/arm64-v8a/$lib"
          done
          if [ "${TDLIB_EXPLICIT_STAGE:-}" = "true" ]; then
            unzip -Z1 "$apk" | grep -Fx 'lib/arm64-v8a/libtdjsonjava.so' || {
              echo "::error::Approved TDLib missing from signed arm64 release"; exit 1;
            }
            align="$(find "$ANDROID_HOME/build-tools" -name zipalign -type f | sort -V | tail -n 1)"
            test -x "$align"
            "$align" -c -P 16 4 "$apk" || {
              echo "::error::Signed TDLib APK failed 16 KiB ZIP alignment"; exit 1;
            }
            found_jsonjava=0
            while IFS= read -r dex; do
              if unzip -p "$apk" "$dex" | strings | grep -Fq 'Lorg/drinkless/tdlib/JsonClient;'; then
                found_jsonjava=1
                break
              fi
            done <<< "$dex_list"
            test "$found_jsonjava" -eq 1 || {
              echo "::error::Approved TDLib JNI Java class stripped from signed APK"; exit 1;
            }
          elif unzip -Z1 "$apk" | grep -Eq '^lib/[^/]+/libtdjsonjava[.]so$'; then
            echo "::error::Unreviewed TDLib present in ordinary APK"; exit 1;
          fi
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose "$apk"
          # Supports both legacy "Signer #1" and new "V2 Signer:" apksigner outputs.
          # Keep signature verification and certificate equality fail-closed.
          actual="$("$apksigner" verify --print-certs "$apk" | node scripts/apk-signing-certificate.cjs)"
          expected="$(keytool -exportcert -alias "$PIA_ANDROID_KEY_ALIAS" -keystore "$PIA_ANDROID_KEYSTORE_PATH" \
            -storepass "$PIA_ANDROID_STORE_PASSWORD" | sha256sum | cut -d ' ' -f 1)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::APK certificate SHA-256 is ${actual}; configured release keystore certificate SHA-256 is ${expected}. Publishing blocked."
            exit 1
          fi
          echo "APK signing certificate matches the configured release key."
          mkdir -p dist
          tag="android-test-b${GITHUB_RUN_NUMBER}-a${GITHUB_RUN_ATTEMPT}"
          name="PersAI-${tag}.apk"
          cp "$apk" "dist/$name"
          (cd dist && sha256sum "$name" > "$name.sha256")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Publish permanent GitHub prerelease
        id: publish
        if: steps.changes.outputs.needed == 'true'
        working-directory: mobile
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.artifact.outputs.tag }}
          APK_NAME: ${{ steps.artifact.outputs.name }}
        shell: bash
        run: |
          set -euo pipefail
          # The branch may advance during Gradle compilation; never publish stale binaries.
          current_main="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq '.object.sha')"
          if [ "$current_main" != "$TARGET_SHA" ]; then
            echo "Main advanced while building; skip stale APK. The next green CI will trigger a fresh build."
            exit 0
          fi
          cat > "$RUNNER_TEMP/apk-notes.md" <<EOF
          Android test APK built from verified main commit ${TARGET_SHA}.

          - Standalone release APK with native SQLCipher (not Expo Go/debug).
          - Android package: ${{ env.PIA_ANDROID_PACKAGE }}
          - Build number: ${{ steps.version.outputs.code }}
          - Checksum: see attached .sha256 file.
          - Upgrade without uninstalling: keep the same signing certificate and package ID.
          - Test build only. Validate encrypted memory backup/restore on real devices.

          Setup: docs/RELEASE_APK.md · Device QA: docs/DEVICE_QA.md
          EOF
          if [ "${TDLIB_EXPLICIT_STAGE:-}" = "true" ]; then
            echo '- Telegram TDLib: official source and SHA-256 verified; physical Vivo acceptance pending.' >> "$RUNNER_TEMP/apk-notes.md"
          else
            echo '- Telegram TDLib: NOT INCLUDED; personal Saved Messages import unavailable.' >> "$RUNNER_TEMP/apk-notes.md"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "dist/$APK_NAME" "dist/$APK_NAME.sha256" --clobber
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/apk-notes.md"
          else
            gh release create "$TAG" "dist/$APK_NAME" "dist/$APK_NAME.sha256" \
              --title "Android test ${TAG}" --notes-file "$RUNNER_TEMP/apk-notes.md" \
              --target "$TARGET_SHA" --prerelease
          fi
          # This output is deliberately absent if main advanced and no APK was published.
          echo "published=true" >> "$GITHUB_OUTPUT"

      - name: Notify Telegram after the APK was published
        if: ${{ steps.publish.outputs.published == 'true' }}
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APK_TAG: ${{ steps.artifact.outputs.tag }}
          APK_NAME: ${{ steps.artifact.outputs.name }}
          APK_VERSION_CODE: ${{ steps.version.outputs.code }}
        shell: bash
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "::warning::Telegram APK notification skipped. Add TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID to PersonalAI repository secrets."
            exit 0
          fi
          python3 .github/scripts/notify-android-apk.py

      # Never cache signing material or compiled APKs, only native object files.
      - name: Save trusted arm64 C/C++ compiler cache
        if: ${{ steps.changes.outputs.needed == 'true' && success() && env.PERSAI_CCACHE_BIN != '' }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-persai-native-ccache-arm64-v8a-v1-${{ hashFiles('mobile/package-lock.json') }}-${{ github.run_id }}
