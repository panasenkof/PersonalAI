name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    name: Mobile (typecheck + regression tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        env:
          # JS tests and bundle do not execute the native runtime. Native CI downloads it separately.
          RNET_SKIP_DOWNLOAD: '1'
        run: npm ci --no-audit --no-fund
      - name: Verify approved Nebula source artwork
        # Prevent AI agents or image optimizers from replacing the agreed originals.
        run: node scripts/check-nebula-references.cjs
      - name: Compile original-backed Nebula SkSL (CanvasKit WASM)
        run: node scripts/check-nebula-sksl.cjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        # github-actions: failing assertions appear as annotations on the PR.
        run: npx jest --ci --reporters=default --reporters=github-actions
      - name: Android release configuration tests
        run: node --test scripts/prepare-android-release.test.cjs scripts/apk-signing-certificate.test.cjs scripts/android-release-policy.test.cjs
      - name: Expo dependency compatibility
        run: npx expo install --check
      - name: Bundle Android (current release target)
        run: npx expo export --platform android --output-dir /tmp/native-export
      - name: Browser acceptance of production screens
        run: |
          npx playwright install --with-deps chromium
          node scripts/verify-mobile-ui.cjs
          node scripts/verify-nebula-home-prototype.cjs

  required:
    # Keep this job name: it may be a required status check for main.
    name: CI required
    if: ${{ always() }}
    needs: [mobile]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to pass
        env:
          MOBILE: ${{ needs.mobile.result }}
        run: |
          echo "MOBILE: $MOBILE"
          if [ "$MOBILE" != success ]; then
            echo "::error::Mobile check is $MOBILE (expected success)"
            exit 1
          fi
