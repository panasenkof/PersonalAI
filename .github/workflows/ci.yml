name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        run: mypy app
      - name: Tests (pytest)
        run: pytest tests/ -q
      - name: Evals (scripted LLM, deterministic)
        run: python -m evals.runner --json evals-report.json
      - name: Alembic smoke (fresh DB from scratch)
        run: |
          rm -f /tmp/ci_mig.db
          DATABASE_URL="sqlite+aiosqlite:////tmp/ci_mig.db" alembic upgrade head

  backend-postgres:
    name: Backend (Postgres + pgvector + Redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pia
          POSTGRES_PASSWORD: pia
          POSTGRES_DB: pia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pia" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://pia:pia@localhost:5432/pia
      DB_NULL_POOL: "true"   # the suite mixes event loops; production uses the pool
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Alembic upgrade on Postgres (migrations == models, pgvector + HNSW index)
        run: alembic upgrade head
      - name: Tests on Postgres
        run: pytest tests/ -q --deselect tests/test_pgvector.py
      - name: Real Redis queue smoke (enqueue → worker → done)
        run: python -m tests.redis_smoke

  mobile:
    name: Mobile (typecheck + unit tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx jest --ci
