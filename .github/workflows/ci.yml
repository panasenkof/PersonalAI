name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (SQLite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - name: Install dependencies
        run: pip install -r requirements.lock -r requirements-dev.lock
      - name: Lint (ruff)
        run: ruff check .
      - name: Local pilot configuration regression
        run: python ../scripts/test_configure_local_pilot.py
      - name: Type check (mypy)
        run: mypy app
      - name: Tests (pytest)
        run: pytest tests/ -q
      - name: Evals (scripted LLM, deterministic)
        run: python -m evals.runner --json evals-report.json
      - name: Alembic smoke (fresh DB from scratch)
        run: |
          rm -f /tmp/ci_mig.db
          DATABASE_URL="sqlite+aiosqlite:////tmp/ci_mig.db" alembic upgrade head

  backend-windows:
    name: Backend Windows portability
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - name: Install dependencies
        run: pip install -r requirements.lock -r requirements-dev.lock
      - name: Windows import, journal and admission regressions
        run: pytest tests/test_neighbor_review.py -q

  backend-postgres:
    name: Backend (Postgres + pgvector + Redis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pia
          POSTGRES_PASSWORD: pia
          POSTGRES_DB: pia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pia" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://pia:pia@localhost:5432/pia
      DB_NULL_POOL: "true"   # the suite mixes event loops; production uses the pool
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - name: Install dependencies
        run: pip install -r requirements.lock -r requirements-dev.lock
      - name: Alembic upgrade on Postgres (migrations == models, pgvector + HNSW index)
        run: alembic upgrade head
      - name: Upgrade existing Postgres installation
        env:
          PGPASSWORD: pia
          MIGRATION_TEST_DATABASE_URL: postgresql+asyncpg://pia:pia@localhost:5432/pia_upgrade
        run: |
          createdb -h localhost -U pia pia_upgrade
          pytest tests/test_upgrade.py -q -k postgres
      - name: Tests on Postgres
        run: pytest tests/ -q --deselect tests/test_pgvector.py
      - name: Real Redis queue smoke (enqueue → worker → done)
        run: python -m tests.redis_smoke

  mobile:
    name: Web and mobile (typecheck + regression tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npx jest --ci
      - name: Expo dependency compatibility
        run: npx expo install --check
      - name: Bundle both native platforms
        run: npx expo export --platform android --platform ios --output-dir /tmp/native-export
      - name: Browser acceptance
        run: |
          npx playwright install --with-deps chromium
          node --test ../scripts/web-test-server.test.cjs
          NODE_PATH="$PWD/node_modules" node ../scripts/verify-web.cjs

  docker-smoke:
    name: Production compose and scaling
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: 'ci-special:@/%password'
      JWT_SECRET: 'ci-only-jwt-secret-at-least-thirty-two-characters'
      PIA_AGENT_SECRET: 'MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA='
      BACKUP_ENCRYPTION_KEY: 'MTExMTExMTExMTExMTExMTExMTExMTExMTExMTExMTE='
    steps:
      - uses: actions/checkout@v4
      - name: Validate and start production services
        run: |
          docker compose config --quiet
          docker compose up -d --build --wait --wait-timeout 240 --scale app=2
          curl --fail --retry 5 --retry-delay 2 http://localhost:8000/ready
          test "$(docker compose ps -q app | wc -l)" -eq 2
          docker compose exec -T worker python -m app.queue.health
      - name: Encrypted backup and isolated Postgres restore
        run: ./scripts/verify-backup-compose.sh
      - name: Logs
        if: failure()
        run: docker compose logs --no-color --tail 100
      - name: Cleanup
        if: always()
        run: docker compose down -v
