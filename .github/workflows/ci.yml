name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.scope.outputs.mobile }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changes and verify roadmap
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          node mobile/scripts/check-roadmap-integrity.cjs
          node mobile/scripts/check-memory-acceptance.cjs
          node mobile/scripts/check-memory-acceptance-cost.cjs
          node --test mobile/scripts/check-memory-acceptance-cost.test.cjs
          node --test mobile/scripts/check-llm-access.test.cjs
          node --test mobile/scripts/check-memory-acceptance.test.cjs
          node mobile/scripts/check-nebula-references.cjs
          node --test mobile/scripts/ci-scope.test.cjs
          node --test mobile/scripts/classify-emulator-failure.test.cjs
          node mobile/scripts/ci-scope.cjs

  native:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    uses: ./.github/workflows/mobile-native-sqlcipher.yml

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    timeout-minutes: 20
    name: Mobile (typecheck + regression tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        env:
          # JS tests and bundle do not execute the native runtime. Native CI downloads it separately.
          RNET_SKIP_DOWNLOAD: '1'
        run: npm ci --no-audit --no-fund
      - name: Verify approved icon, splash and adaptive assets
        run: node --test scripts/approved-brand.test.cjs
      - name: Compile original-backed Nebula SkSL (CanvasKit WASM)
        run: node scripts/check-nebula-sksl.cjs
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        # github-actions: failing assertions appear as annotations on the PR.
        run: npx jest --ci --maxWorkers=2 --reporters=default --reporters=github-actions
      - name: Android release configuration tests
        run: node --test scripts/prepare-android-release.test.cjs scripts/apk-signing-certificate.test.cjs scripts/android-release-policy.test.cjs scripts/verify-main-ci.test.cjs scripts/prepare-browser-ci.test.cjs
      - name: Expo dependency compatibility
        run: npx expo install --check
      - name: Browser acceptance of production screens
        env:
          SCREENSHOT_DIR: ${{ runner.temp }}/persai-ui
        run: |
          bash scripts/prepare-browser-ci.sh
          node scripts/verify-mobile-ui.cjs
          node scripts/verify-nebula-home-prototype.cjs

      - name: Upload browser UI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: browser-ui-${{ github.sha }}
          path: ${{ runner.temp }}/persai-ui
          if-no-files-found: ignore
          retention-days: 7

  required:
    # Keep this job name: it may be a required status check for main.
    name: CI required
    if: ${{ always() }}
    needs: [changes, mobile, native]
    runs-on: ubuntu-latest
    steps:
      - name: Require all CI jobs to pass
        env:
          SCOPE: ${{ needs.changes.result }}
          MOBILE_NEEDED: ${{ needs.changes.outputs.mobile }}
          MOBILE: ${{ needs.mobile.result }}
          NATIVE: ${{ needs.native.result }}
        run: |
          test "$SCOPE" = success
          if [ "$MOBILE_NEEDED" = true ]; then
            test "$MOBILE" = success
            test "$NATIVE" = success
          elif [ "$MOBILE_NEEDED" = false ]; then
            test "$MOBILE" = skipped
            test "$NATIVE" = skipped
          else
            exit 1
          fi
