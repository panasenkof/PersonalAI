name: Live evals

# Runs the golden scenarios against a REAL LLM. Needs the repository secret EVAL_LLM_API_KEY
# (optional variables: EVAL_LLM_BASE_URL, EVAL_LLM_MODEL). Without the secret (e.g. PRs from forks)
# the job reports "skipped" instead of failing.
on:
  schedule:
    - cron: "17 3 * * *"        # nightly: catches model/provider drift
  push:
    branches: [main]
    paths:
      - "backend/app/agent/**"
      - "backend/app/domains/**"
      - "backend/app/llm/**"
      - "backend/app/rag/**"
      - "backend/evals/**"
  pull_request:
    paths:
      - "backend/app/agent/**"
      - "backend/app/domains/**"
      - "backend/app/llm/**"
      - "backend/app/rag/**"
      - "backend/evals/**"
  workflow_dispatch:
    inputs:
      runs:
        description: "Repetitions per case (LLMs are stochastic)"
        default: "3"
      model:
        description: "Model override (EVAL_LLM_MODEL)"
        required: false

concurrency:
  group: evals-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    env:
      EVAL_LLM_API_KEY: ${{ secrets.EVAL_LLM_API_KEY }}
      EVAL_LLM_BASE_URL: ${{ vars.EVAL_LLM_BASE_URL || 'https://api.openai.com/v1' }}
      EVAL_LLM_MODEL: ${{ inputs.model || vars.EVAL_LLM_MODEL || 'gpt-4o-mini' }}
      EVAL_EMBEDDING_MODEL: ${{ vars.EVAL_EMBEDDING_MODEL || 'text-embedding-3-small' }}
    steps:
      - uses: actions/checkout@v4
      - name: Check credentials
        id: creds
        run: |
          if [ -n "$EVAL_LLM_API_KEY" ]; then echo "have_key=true" >> "$GITHUB_OUTPUT"
          else echo "have_key=false" >> "$GITHUB_OUTPUT"; echo "::notice::EVAL_LLM_API_KEY is not set — live evals skipped"; fi
      - uses: actions/setup-python@v5
        if: steps.creds.outputs.have_key == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.lock
      - name: Install dependencies
        if: steps.creds.outputs.have_key == 'true'
        run: pip install -r requirements.lock
      - name: Run golden set against the live model
        if: steps.creds.outputs.have_key == 'true'
        # ≥80% of repetitions of every case must pass (stochastic model); scripted evals stay at 100% in CI
        run: python -m evals.runner --live --runs "${{ inputs.runs || '3' }}" --min-pass-rate 0.8 --json evals-live-report.json
      - name: Upload report
        if: always() && steps.creds.outputs.have_key == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: evals-live-report
          path: backend/evals-live-report.json
          if-no-files-found: ignore
