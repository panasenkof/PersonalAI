name: LLM connectivity (quick, one paid request, no Android)

on:
  workflow_dispatch:
    inputs:
      live_llm:
        description: "Make one actual LLM request (not a free offline check)"
        required: true
        type: boolean
        default: false
      paid_confirmation:
        description: "Type RUN_PAID_LLM to allow exactly one API request"
        required: true
        type: string
        default: ""

permissions:
  contents: read

jobs:
  connectivity:
    name: One-request HTTPS + key + model check (no npm or APK)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.live_llm == true && inputs.paid_confirmation == 'RUN_PAID_LLM' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PERSAI_EVAL_MANUAL_TRIGGER: ${{ github.event_name }}
      PERSAI_EVAL_PAID_OPT_IN: ${{ inputs.paid_confirmation }}
      PERSAI_EVAL_LLM_API_KEY: ${{ secrets.PERSAI_EVAL_LLM_API_KEY }}
      PERSAI_EVAL_LLM_BASE_URL: ${{ vars.PERSAI_EVAL_LLM_BASE_URL }}
      PERSAI_EVAL_LLM_MODEL: ${{ vars.PERSAI_EVAL_LLM_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify real provider access and one short answer
        run: node mobile/scripts/check-llm-access.cjs
