name: Native Android UI smoke

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      vision_expo_gate:
        description: "Kotlin 2.4 vision engine in real Expo/SQLCipher APK; ordinary release parity"
        required: false
        type: boolean
        default: false

concurrency:
  group: native-sqlcipher-${{ github.ref }}-${{ inputs.vision_expo_gate && 'vision' || 'normal' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  native-sqlcipher:
    runs-on: ubuntu-latest
    # The Whisper runtime (react-native-executorch) compiles a large C++ library.
    timeout-minutes: 90
    env:
      # One emulator ABI; signed phone release still builds ARM64.
      ORG_GRADLE_PROJECT_reactNativeArchitectures: x86_64
      RNET_TARGET: android-x86_64
      PIA_ANDROID_PACKAGE: com.persai.app
      MAESTRO_VERSION: 2.0.10
      # Re-downloads in CI change compiler mtimes; hash the NDK compiler contents.
      CCACHE_COMPILERCHECK: content
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 768M
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      # A fresh GitHub Ubuntu image contains multiple large, unrelated
      # toolchains. Free space BEFORE the native build, so both Gradle and the
      # later emulator can run without deleting Android test dependencies.
      - name: Reclaim unused hosted runner toolchains
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk before unused-toolchain cleanup:"
          df -h "$RUNNER_TEMP"
          for unused in /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup; do
            if [ -d "$unused" ]; then
              echo "Removing unused CI toolchain: $unused"
              sudo rm -rf -- "$unused"
            fi
          done
          echo "Disk after unused-toolchain cleanup:"
          df -h "$RUNNER_TEMP"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Reuse trusted Gradle cache (PR cannot write)
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: android-actions/setup-android@v3
        with:
          # The Android SDK removed the obsolete "tools" package, which this
          # action still requests by default. Only install supported packages.
          packages: platform-tools
      # PRs only restore caches produced by trusted main: never write a PR's
      # object files into a cache which a privileged release could consume.
      - name: Restore trusted x86_64 C/C++ compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-persai-native-ccache-x86_64-v1-${{ hashFiles('mobile/package-lock.json') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-persai-native-ccache-x86_64-v1-${{ hashFiles('mobile/package-lock.json') }}-
      - name: Install and prepare C/C++ compiler cache
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ccache >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ccache
          fi
          launcher="$(command -v ccache)"
          test -x "$launcher"
          echo "PERSAI_CCACHE_BIN=$launcher" >> "$GITHUB_ENV"
          ccache --zero-stats
          ccache --version | head -n 1
      # AGP may try to download r27 during :expo-sqlite configuration.
      # A transient truncated/invalid ZIP then fails the entire native build
      # before any product code compiles. Install and verify independently.
      - name: Install and verify required NDK (retry SDK transport only)
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          ndk_version="27.0.12077973"
          test -n "$sdk_root"
          sdkmanager="$(find "$sdk_root/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$sdkmanager"
          ndk_path="$sdk_root/ndk/$ndk_version"
          for attempt in 1 2 3; do
            if test -s "$ndk_path/source.properties" &&
               grep -q "^Pkg.Revision *= *$ndk_version" "$ndk_path/source.properties"; then
              echo "Verified Android NDK $ndk_version"
              break
            fi
            echo "Installing Android NDK $ndk_version, transport attempt $attempt/3"
            rm -rf "$ndk_path"
            if "$sdkmanager" --sdk_root="$sdk_root" "ndk;$ndk_version"; then
              if test -s "$ndk_path/source.properties" &&
                 grep -q "^Pkg.Revision *= *$ndk_version" "$ndk_path/source.properties"; then
                echo "NDK verified after installation"
                break
              fi
            fi
            if test "$attempt" -eq 3; then
              echo "::error::Unable to install verified NDK $ndk_version after three SDK transport attempts"
              exit 1
            fi
            sleep $((attempt * 3))
          done
          test -s "$ndk_path/source.properties"
      - name: Cache verified ExecuTorch release downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/react-native-executorch
          key: ${{ runner.os }}-executorch-${{ hashFiles('mobile/package-lock.json') }}
      - name: Install locked JS and shared Android Java dependencies
        # Upstream only puts the architecture-independent executorch.jar in ARM64 core.
        # Download it using the upstream checksum-validating installer, but compile x86_64 only.
        env:
          RNET_TARGET: android-arm64-v8a
        run: npm ci --no-audit --no-fund
      - name: Prepare emulator native libraries and verify Java bridge
        run: |
          node node_modules/react-native-executorch/scripts/download-libs.js
          test -s node_modules/react-native-executorch/third-party/android/libs/executorch.jar
      - name: Stage checksum-verified upstream Audio API native binaries
        shell: bash
        run: |
          set -euo pipefail
          pkg="node_modules/react-native-audio-api"
          node -e "if(require('./node_modules/react-native-audio-api/package.json').version!=='0.13.6')process.exit(1)"
          # The exact assets normally downloaded by the upstream Gradle task
          # are pinned to immutable GitHub release digests, not a PR-supplied URL.
          # Once present, upstream's own artifacts_present() verifies them and
          # skips a fragile network request during CMake builds.
          fetch_audio_asset() {
            local name="$1" digest="$2" id="$3" dest="$4"
            local zip="$RUNNER_TEMP/rnaudio-$name"
            local downloaded=0
            for url in \
              "https://github.com/software-mansion-labs/rn-audio-libs/releases/download/v3.1.0/$name" \
              "https://api.github.com/repos/software-mansion-labs/rn-audio-libs/releases/assets/$id"; do
              rm -f "$zip"
              if curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 \
                --connect-timeout 20 --max-time 150 --header 'Accept: application/octet-stream' \
                --output "$zip" "$url" &&
                printf '%s  %s\n' "$digest" "$zip" | sha256sum --check --status &&
                unzip -tq "$zip" >/dev/null; then
                downloaded=1
                break
              fi
              echo "::warning::Audio API $name unavailable or checksum-invalid from $url"
            done
            if [ "$downloaded" -ne 1 ]; then
              echo "::error::Cannot verify pinned upstream Audio API $name (v3.1.0)"
              exit 1
            fi
            mkdir -p "$dest"
            unzip -qo "$zip" -d "$dest"
            rm -f "$zip"
          }
          fetch_audio_asset android.zip \
            "5f6d01fc82cb736f00485f40d78735414494096a3a14be616c17666babbc046a" 407376170 \
            "$pkg/common/cpp/audioapi/external"
          fetch_audio_asset jniLibs.zip \
            "10d29ce385ffaee74c1bcdedef0794a7fa53a035390f5c0766e33c75ba21beee" 407376243 \
            "$pkg/android/src/main"
          for abi in armeabi-v7a arm64-v8a x86_64 x86; do
            for lib in libopusfile.a libopus.a libogg.a libvorbis.a libvorbisenc.a libvorbisfile.a; do
              test -s "$pkg/common/cpp/audioapi/external/android/$abi/$lib"
            done
            for lib in libavcodec.so libavformat.so libavutil.so libswresample.so; do
              test -s "$pkg/android/src/main/jniLibs/$abi/$lib"
            done
          done
      - name: Install checksum-verified Gradle 8.13 for Kotlin 2.4 vision producer
        if: ${{ inputs.vision_expo_gate }}
        shell: bash
        run: |
          set -euo pipefail
          # Preserve the already configured trusted Gradle cache. Provision the
          # pinned distribution independently of setup-gradle's single CDN URL.
          # Official release SHA: https://gradle.org/release-checksums/
          sha="20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78"
          zip="$RUNNER_TEMP/gradle-8.13-bin.zip"
          installed=0
          for url in \
            "https://downloads.gradle.org/distributions/gradle-8.13-bin.zip" \
            "https://services.gradle.org/distributions/gradle-8.13-bin.zip" \
            "https://github.com/gradle/gradle-distributions/releases/download/v8.13.0/gradle-8.13-bin.zip"; do
            rm -f "$zip"
            if curl --fail --location --retry 2 --retry-all-errors --retry-delay 2 \
              --connect-timeout 20 --max-time 180 --output "$zip" "$url" &&
              printf '%s  %s\n' "$sha" "$zip" | sha256sum --check --status; then
              installed=1
              break
            fi
            echo "::warning::Gradle 8.13 unavailable or digest mismatch at $url; trying next official host"
          done
          if [ "$installed" -eq 1 ]; then
            unzip -q "$zip" -d "$RUNNER_TEMP"
            test -x "$RUNNER_TEMP/gradle-8.13/bin/gradle"
            "$RUNNER_TEMP/gradle-8.13/bin/gradle" --version | grep 'Gradle 8.13'
            echo "$RUNNER_TEMP/gradle-8.13/bin" >> "$GITHUB_PATH"
          else
            # Last resort: reuse Gradle 9.3.1 from trusted main's restored
            # wrapper cache. Kotlin Gradle Plugin 2.4.21 supports Gradle 9.3.1,
            # and AGP 8.13 requires >=8.13. Do not fetch an unknown version.
            # The following :probe:assembleDebug AND signed Expo APK/ABI AND
            # Android smoke gates remain mandatory; compatibility is proved by
            # those builds, never inferred from a version number alone.
            cached="$(find "$HOME/.gradle/wrapper/dists/gradle-9.3.1-bin" \
              -type f -path '*/gradle-9.3.1/bin/gradle' -print -quit 2>/dev/null || true)"
            if [ -z "$cached" ] || [ ! -x "$cached" ]; then
              echo "::error::No verified Gradle 8.13 or trusted cached Gradle 9.3.1; cannot run native CI"
              exit 1
            fi
            "$cached" --version | grep 'Gradle 9.3.1'
            echo "::warning::Official Gradle 8.13 hosts unavailable; using trusted cached Gradle 9.3.1 for full Kotlin/Android gates"
            echo "$(dirname "$cached")" >> "$GITHUB_PATH"
          fi
          rm -f "$zip"
      - name: Stage offline vision AAR and Java ABI for Expo compatibility gate
        if: ${{ inputs.vision_expo_gate }}
        env:
          PIA_VISION_EXPO_GATE: "true"
        run: |
          gradle -p ../spikes/photo-83-1-android :probe:assembleDebug --no-daemon --stacktrace
          node scripts/stage-vision-expo-gate.cjs prepare
      - name: Generate native Android project including Expo SQLCipher
        run: npx expo prebuild --platform android --no-install --clean
      - name: Inject opt-in vision runtime into generated Expo APK only
        if: ${{ inputs.vision_expo_gate }}
        env:
          PIA_VISION_EXPO_GATE: "true"
        run: |
          node scripts/stage-vision-expo-gate.cjs inject
          test -s modules/persai-vision/android/libs/vision-api.jar
          test -s modules/persai-vision/android/libs/vision-engine.aar
          grep -q 'PersAI #83.2 Expo native inference ABI CI gate' android/app/build.gradle
      - name: Local models over http:// are allowed by the manifest
        run: grep -q 'android:usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml
      - name: Compile standalone release APK with an ephemeral CI-only signing key
        env:
          PIA_ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/pia-ephemeral-qa.p12
          PIA_ANDROID_KEY_ALIAS: pia-ci-only
          PIA_ANDROID_STORE_PASSWORD: ephemeral-ci-password-only
          PIA_ANDROID_KEY_PASSWORD: ephemeral-ci-password-only
        run: |
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore "$PIA_ANDROID_KEYSTORE_PATH" -alias "$PIA_ANDROID_KEY_ALIAS" \
            -keyalg RSA -keysize 2048 -validity 2 \
            -storepass "$PIA_ANDROID_STORE_PASSWORD" -keypass "$PIA_ANDROID_KEY_PASSWORD" \
            -dname 'CN=PersAI CI Test,O=Ephemeral QA,C=US'
          node scripts/prepare-android-release.cjs
          cd android
          ./gradlew :app:assembleRelease --init-script ../scripts/ci-native-ccache.init.gradle --build-cache --no-configuration-cache --no-daemon --stacktrace
          test -s app/build/outputs/apk/release/app-release.apk
          unzip -Z1 app/build/outputs/apk/release/app-release.apk | grep -Fx 'assets/index.android.bundle'
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk

      - name: Verify compiler cache was wired into every native CMake module
        run: |
          node scripts/verify-native-ccache.cjs
          ccache --show-stats
      - name: Validate native APK archive
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          # On-device Whisper: the ExecuTorch runtime and its CPU backend are packaged.
          for lib in libRnExecutorch.so libexecutorch.so libxnnpack_executorch_backend.so; do
            unzip -Z1 "$APK" | grep -Fx "lib/x86_64/$lib"
          done
          echo "APK generated and archive verified: $APK"

      - name: Prove opt-in engine classes in the real signed Expo release APK
        if: ${{ inputs.vision_expo_gate }}
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          DEX_LIST="$(unzip -Z1 "$APK" | grep -E '^classes[0-9]*[.]dex$')"
          test -n "$DEX_LIST"
          found=0
          while IFS= read -r dex; do
            if unzip -p "$APK" "$dex" | strings | grep -q 'VisionInteropApi'; then
              found=1
              break
            fi
          done <<< "$DEX_LIST"
          test "$found" -eq 1 || { echo "::error::Vision ABI missing in signed Expo APK"; exit 1; }
          if unzip -Z1 "$APK" | grep -E '[.]litertlm$'; then
            echo "::error::Model weights included unexpectedly"; exit 1
          fi
          echo "Expo release APK embeds Kotlin 2.4 engine Java ABI; runtime inference still not proved." >> "$GITHUB_STEP_SUMMARY"
      - name: Save standalone emulator APK
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-apk-${{ github.sha }}
          path: mobile/android/app/build/outputs/apk/release/app-release.apk
          retention-days: 3
      # Release APK is already signed, validated and uploaded.
      # Only remove the release build's intermediate outputs (not the APK).
      # The subsequent real PDF instrumentation test invokes Gradle again:
      # therefore keep Android NDK, module/native build inputs and Gradle
      # dependency caches intact until BOTH emulator tests have passed.
      - name: Reclaim release intermediates before Android emulator
        shell: bash
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$apk"
          echo "Disk before post-build cleanup:"
          df -h "$RUNNER_TEMP"
          rm -rf android/app/build/intermediates \
            android/app/build/generated \
            android/app/.cxx \
            android/.gradle \
            ../spikes/photo-83-1-android/build
          echo "Disk after post-build cleanup:"
          df -h "$RUNNER_TEMP"
          test -s "$apk"
          available_kib="$(df -Pk "$RUNNER_TEMP" | awk 'NR==2 {print $4}')"
          if [ "$available_kib" -lt 5242880 ]; then
            echo "::error::Insufficient disk for Android emulator + PDF Gradle test (5 GiB required)"
            exit 1
          fi
      - name: Install checksum-verified pinned Maestro CLI
        shell: bash
        run: |
          set -euo pipefail
          test "$MAESTRO_VERSION" = "2.0.10" || {
            echo "::error::Update the pinned Maestro SHA when upgrading the CLI"; exit 1;
          }
          # GitHub release asset digest, not a checksum from a third-party host.
          # https://github.com/mobile-dev-inc/Maestro/releases/tag/cli-2.0.10
          sha="dbdcfbe2b673e1a6f40c65664f1ed5becad0b0a40e35d0e203dff511d05032f6"
          zip="$RUNNER_TEMP/maestro.zip"
          installed=0
          for url in \
            "https://github.com/mobile-dev-inc/Maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip" \
            "https://api.github.com/repos/mobile-dev-inc/Maestro/releases/assets/315856532"; do
            rm -f "$zip"
            if curl --fail --location --retry 3 --retry-all-errors --retry-delay 2 \
              --connect-timeout 20 --max-time 240 --header 'Accept: application/octet-stream' \
              --output "$zip" "$url" &&
              printf '%s  %s\n' "$sha" "$zip" | sha256sum --check --status; then
              installed=1
              break
            fi
            echo "::warning::Maestro release unavailable or digest mismatch at $url; trying next official endpoint"
          done
          if [ "$installed" -ne 1 ]; then
            echo "::error::Maestro CLI 2.0.10 unavailable or checksum invalid"
            exit 1
          fi
          unzip -q "$zip" -d "$RUNNER_TEMP/maestro-cli"
          test -x "$RUNNER_TEMP/maestro-cli/maestro/bin/maestro"
          echo "$RUNNER_TEMP/maestro-cli/maestro/bin" >> "$GITHUB_PATH"
          rm -f "$zip"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # AOSP (no Google Pixel Launcher) is sufficient for the offline flow.
      # Each attempt creates its own AVD. The second is only for a proven
      # system/emulator failure, never for a failed product assertion.
      - name: Run real Android UI smoke
        id: android_ui_first
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SMOKE_ATTEMPT: '1'
          MAESTRO_CLI_NO_ANALYTICS: '1'
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_2
          ram-size: 2048M
          heap-size: 384M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            bash mobile/scripts/android-ui-smoke.sh
            bash mobile/scripts/android-pdf-page-smoke.sh
      - name: Classify first Android smoke failure
        id: android_ui_classify
        if: ${{ steps.android_ui_first.outcome == 'failure' }}
        run: node scripts/classify-emulator-failure.cjs qa/android-results/attempt-1
      - name: Retry only an emulator infrastructure failure
        id: android_ui_retry
        if: ${{ steps.android_ui_first.outcome == 'failure' && steps.android_ui_classify.outputs.retry == 'true' }}
        uses: reactivecircus/android-emulator-runner@v2
        env:
          SMOKE_ATTEMPT: '2'
          MAESTRO_CLI_NO_ANALYTICS: '1'
        with:
          api-level: 35
          arch: x86_64
          target: default
          profile: pixel_2
          ram-size: 2048M
          heap-size: 384M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            bash mobile/scripts/android-ui-smoke.sh
            bash mobile/scripts/android-pdf-page-smoke.sh
      - name: Preserve Android evidence even after failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-evidence-${{ github.sha }}
          path: mobile/qa/android-results/
          retention-days: 7
          if-no-files-found: warn
      - name: Require successful Android smoke, without suppressing app failures
        if: ${{ always() }}
        env:
          FIRST: ${{ steps.android_ui_first.outcome }}
          SECOND: ${{ steps.android_ui_retry.outcome }}
        run: |
          if [ "$FIRST" = success ] || [ "$SECOND" = success ]; then
            echo "Android UI smoke PASSED"
          else
            echo "::error::Android UI smoke failed (first=$FIRST, retry=$SECOND). See saved evidence."
            exit 1
          fi
      # Only main is allowed to publish compiler objects for future PR restores.
      - name: Save trusted x86_64 C/C++ compiler cache
        if: ${{ github.ref == 'refs/heads/main' && success() }}
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-persai-native-ccache-x86_64-v1-${{ hashFiles('mobile/package-lock.json') }}-${{ github.run_id }}
