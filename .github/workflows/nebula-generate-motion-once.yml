# Temporary build/bootstrap for experimentally rendered native video asset.
# The action deletes itself after producing reproducible source-derived assets.
name: Generate approved Nebula motion study assets (one-shot)
on:
  push:
    branches: [feat/nebula-native-motion-candidate-20261021]
    paths: [mobile/scripts/generate-nebula-motion.py]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install offline-frame-generation dependencies
        run: pip install --disable-pip-version-check 'numpy==2.2.6' 'opencv-python-headless==4.11.0.86' 'Pillow==11.3.0'
      - name: Verify ffmpeg and generate derived animated orb (NOT user original)
        run: |
          ffmpeg -version | head -1
          python mobile/scripts/generate-nebula-motion.py \
            --archive docs/design/references/PersAI_Nebula_Approved_References.zip \
            --output mobile/src/design/nebula/assets/nebula-orb-rnd.mp4 \
            --poster mobile/src/design/nebula/assets/nebula-orb-rnd-poster.png
          ffprobe -v error -show_entries format=duration,size -of json mobile/src/design/nebula/assets/nebula-orb-rnd.mp4
      - name: Self-remove bootstrap and push derived experiment assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/nebula-generate-motion-once.yml
          git add mobile/src/design/nebula/assets/nebula-orb-rnd.mp4 mobile/src/design/nebula/assets/nebula-orb-rnd-poster.png .github/workflows/nebula-generate-motion-once.yml
          git commit -m 'feat(nebula): add original-derived plasma motion candidate and static poster'
          git push origin HEAD:refs/heads/feat/nebula-native-motion-candidate-20261021
