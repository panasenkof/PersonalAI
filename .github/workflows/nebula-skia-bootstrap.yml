# Temporary one-shot bootstrap. Generates lockfile with npm and derivative PNG
# from the user-approved original, then removes itself from its final commit.
name: Nebula Skia one-shot dependency and art bootstrap
on:
  push:
    branches: [feat/nebula-skia-hybrid-bc-spike-20261021]
    paths: [mobile/package.json]
permissions:
  contents: write
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Extract and verify approved REF-ORB-B without changing ZIP
        run: |
          pip install --disable-pip-version-check 'Pillow==11.3.0'
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          from io import BytesIO
          import hashlib,zipfile
          zip_file=Path('docs/design/references/PersAI_Nebula_Approved_References.zip')
          assert hashlib.sha256(zip_file.read_bytes()).hexdigest()=='3939d2ccd2b1f814addc4e51802fb5e3875a94f2e456895f8abd82af501b2b2f'
          with zipfile.ZipFile(zip_file) as z: raw=z.read('REF-ORB-B.jfif')
          assert hashlib.sha256(raw).hexdigest()=='4533219948abbb7deace795da0d391c849d88874e014cbd8795a02d455b2a914'
          image=Image.open(BytesIO(raw)).convert('RGB').resize((512,512),Image.Resampling.LANCZOS)
          target=Path('mobile/src/design/nebula/assets/nebula-orb-ref-b.png')
          target.parent.mkdir(parents=True,exist_ok=True)
          image.save(target,format='PNG',optimize=True)
          assert target.stat().st_size>30000
          print('Approved art derived from REF-ORB-B, PNG:',target.stat().st_size,'bytes')
          PY
      - name: Generate real lockfile via npm and verify Expo SDK57 versions
        working-directory: mobile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npx expo install --check
          npx tsc --noEmit
          npx jest --ci --runInBand
      - name: Remove one-shot workflow and commit generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/nebula-skia-bootstrap.yml
          git add mobile/package-lock.json mobile/src/design/nebula/assets/nebula-orb-ref-b.png .github/workflows/nebula-skia-bootstrap.yml
          git commit -m "build(nebula): add npm-verified Skia dependencies and approved art derivative"
          # Other documentation commits can arrive while tests run; rebase them
          # rather than force-pushing or dropping source changes.
          git fetch origin feat/nebula-skia-hybrid-bc-spike-20261021
          git rebase origin/feat/nebula-skia-hybrid-bc-spike-20261021
          git push origin HEAD:refs/heads/feat/nebula-skia-hybrid-bc-spike-20261021
