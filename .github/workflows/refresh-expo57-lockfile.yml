# One-time, branch-scoped lockfile refresh. Removes itself after succeeding.
name: Refresh Expo 57 lockfile (one-time)
on:
  push:
    branches:
      - fix/expo57-ci-lockfile-20261021
    paths:
      - mobile/package.json
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Regenerate npm lockfile from declared dependencies
        working-directory: mobile
        env:
          RNET_SKIP_DOWNLOAD: '1'
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify reproducible install and Expo compatibility
        working-directory: mobile
        env:
          RNET_SKIP_DOWNLOAD: '1'
        run: |
          npm ci --no-audit --no-fund
          npx expo install --check
      - name: Commit real npm-generated lockfile (no manual integrity hashes)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/refresh-expo57-lockfile.yml
          git add mobile/package-lock.json .github/workflows/refresh-expo57-lockfile.yml
          git commit -m "fix(deps): regenerate Expo SDK 57 lockfile and drop bootstrap action"
          git push origin HEAD:refs/heads/fix/expo57-ci-lockfile-20261021
