name: Vision SDK compile spike (isolated)

on:
  pull_request:
    paths:
      - "spikes/photo-83-1-android/**"
      - ".github/workflows/vision-sdk-compile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-sdk-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # ubuntu-latest already has an Android SDK. Avoid setup-android@v3's
      # obsolete 'tools' package request, which fails before our Gradle test.
      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          test -d "${ANDROID_HOME}/platforms/android-35" || {
            echo "::error::Android SDK platform 35 not present on runner"; exit 1;
          }
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Compile isolated Kotlin 2.4 SDK and Android 16 lab APK without model weights
        run: gradle -p spikes/photo-83-1-android :probe:compileDebugKotlin :probe:assembleDebug :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Verify test APK does not request Internet permission
        shell: bash
        run: |
          APK="$(find spikes/photo-83-1-android/app/build/outputs/apk/debug -type f -name '*.apk' | head -1)"
          test -f "$APK" || { echo "::error::No debug APK built"; exit 1; }
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$AAPT" || { echo "::error::Android aapt not found"; exit 1; }
          if "$AAPT" dump permissions "$APK" | grep -q 'android.permission.INTERNET'; then
            echo "::error::Offline vision lab APK must NOT request Internet permission"
            exit 1
          fi
      - name: Report packaged native libraries and retrieval dependency version
        shell: bash
        run: |
          APK="$(find spikes/photo-83-1-android/app/build/outputs/apk/debug -type f -name '*.apk' | head -1)"
          echo "### Offline vision lab runtime packaging inventory" >> "$GITHUB_STEP_SUMMARY"
          echo 'Native libraries present:' >> "$GITHUB_STEP_SUMMARY"
          unzip -Z1 "$APK" | grep '^lib/arm64-v8a/.*\\.so
        with:
          name: persai-vision-lab-android16-diagnostic
          path: spikes/photo-83-1-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Record proof boundary
        if: always()
        run: |
          echo "Standalone Android 16 lab APK compiled; no model weights or private images are bundled." >> "$GITHUB_STEP_SUMMARY"
          echo "No runtime inference is confirmed until tested on Vivo X200 Pro with a user-selected official model." >> "$GITHUB_STEP_SUMMARY"
          echo "PersAI main mobile Gradle config unchanged. Model weights not downloaded." >> "$GITHUB_STEP_SUMMARY"
 | sed 's#^lib/arm64-v8a/##' | sort | head -45 >> "$GITHUB_STEP_SUMMARY" || true
          echo 'Resolved selected Gradle dependencies:' >> "$GITHUB_STEP_SUMMARY"
          gradle -p spikes/photo-83-1-android :app:dependencies --configuration debugRuntimeClasspath --no-daemon |
            grep -E '(tasks-retrieval|litertlm-android|tasks-core|kotlin-stdlib)' |
            sort -u | head -24 >> "$GITHUB_STEP_SUMMARY" || true
      - name: Publish installable standalone lab APK
        uses: actions/upload-artifact@v4
        with:
          name: persai-vision-lab-android16-diagnostic
          path: spikes/photo-83-1-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Record proof boundary
        if: always()
        run: |
          echo "Standalone Android 16 lab APK compiled; no model weights or private images are bundled." >> "$GITHUB_STEP_SUMMARY"
          echo "No runtime inference is confirmed until tested on Vivo X200 Pro with a user-selected official model." >> "$GITHUB_STEP_SUMMARY"
          echo "PersAI main mobile Gradle config unchanged. Model weights not downloaded." >> "$GITHUB_STEP_SUMMARY"
