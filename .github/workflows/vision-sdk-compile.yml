name: Vision SDK compile spike (isolated)

on:
  pull_request:
    paths:
      - "spikes/photo-83-1-android/**"
      - "spikes/photo-83-1-interop-kt21/**"
      - ".github/workflows/vision-sdk-compile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-sdk-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          test -d "$ANDROID_HOME/platforms/android-35" || {
            echo "::error::Android SDK platform 35 not present on runner"; exit 1;
          }
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Compile SDK, JUnit diagnostics and offline lab APK
        run: gradle -p spikes/photo-83-1-android :probe:compileDebugKotlin :probe:assembleDebug :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Verify missing ActivationDataType is present in pinned LiteRT-LM 0.18.0 AAR
        shell: bash
        run: |
          ROOT="$HOME/.gradle/caches/modules-2/files-2.1/com.google.ai.edge.litertlm/litertlm-android/0.18.0"
          AAR="$(find "$ROOT" -type f -name '*.aar' -print -quit)"
          test -f "$AAR" || { echo "::error::LiteRT-LM 0.18.0 AAR not resolved"; exit 1; }
          unzip -p "$AAR" classes.jar > "$RUNNER_TEMP/litertlm-classes.jar"
          if ! jar tf "$RUNNER_TEMP/litertlm-classes.jar" |
            grep -Fx 'com/google/ai/edge/litertlm/ActivationDataType.class'; then
            echo "::error::Pinned LiteRT-LM AAR still lacks ActivationDataType"
            exit 1
          fi
          echo "LiteRT-LM 0.18.0 AAR contains ActivationDataType.class" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify APK permissions and inspect ARM64 native libraries
        shell: bash
        run: |
          APK="$(find spikes/photo-83-1-android/app/build/outputs/apk/debug -type f -name '*.apk' | head -1)"
          test -f "$APK" || { echo "::error::No debug APK built"; exit 1; }
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$AAPT" || { echo "::error::Android aapt not found"; exit 1; }
          if "$AAPT" dump permissions "$APK" | grep -q 'android.permission.INTERNET'; then
            echo "::error::Offline lab must NOT request Internet permission"
            exit 1
          fi
          echo "### Packaged native libraries (ARM64)" >> "$GITHUB_STEP_SUMMARY"
          unzip -Z1 "$APK" | grep 'lib/arm64-v8a/' | head -40 >> "$GITHUB_STEP_SUMMARY" || true
      - name: Publish installable offline diagnostic lab APK
        uses: actions/upload-artifact@v4
        with:
          name: persai-vision-lab-android16-image-to-image
          path: spikes/photo-83-1-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Record proof boundary
        if: always()
        run: |
          echo "Offline Android 16 lab APK compiled; no weights or photos bundled." >> "$GITHUB_STEP_SUMMARY"
          echo "Missing-class diagnostics await real Vivo X200 Pro runtime validation." >> "$GITHUB_STEP_SUMMARY"
          echo "Main PersAI Kotlin toolchain and memory remain untouched." >> "$GITHUB_STEP_SUMMARY"

  kotlin21-java-abi-consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Build Kotlin 2.4 engine AAR with Java ABI
        run: gradle -p spikes/photo-83-1-android :probe:assembleDebug --no-daemon --stacktrace
      - name: Inspect public Java ABI and hard fail on vendor types
        shell: bash
        run: |
          set -euo pipefail
          AAR=spikes/photo-83-1-android/probe/build/outputs/aar/probe-debug.aar
          test -s "$AAR"
          unzip -p "$AAR" classes.jar > "$RUNNER_TEMP/producer.jar"
          javap -public -classpath "$RUNNER_TEMP/producer.jar" com.persai.visionsdkprobe.VisionInteropApi > "$RUNNER_TEMP/abi.txt"
          grep -q 'public static double scoreTextImage(android.content.Context, java.io.File, android.graphics.Bitmap, java.lang.String)' "$RUNNER_TEMP/abi.txt"
          if grep -Eq 'com.google.|kotlin.|UniversalEmbedder|Function1|List<' "$RUNNER_TEMP/abi.txt"; then
            echo "::error::Vendor or Kotlin types escaped into the Java ABI"; exit 1
          fi
          cat "$RUNNER_TEMP/abi.txt"
      - name: Publish API-only Java compile stub, no Kotlin 2.4 metadata
        shell: bash
        run: |
          set -euo pipefail
          DEST="$GITHUB_WORKSPACE/spikes/photo-83-1-interop-kt21/consumer/libs"
          mkdir -p "$DEST"
          STUB="$(mktemp -d)"
          ( cd "$STUB" && jar xf "$RUNNER_TEMP/producer.jar" com/persai/visionsdkprobe/VisionInteropApi.class && jar cf "$DEST/vision-api.jar" com/persai/visionsdkprobe/VisionInteropApi.class )
          test -s "$DEST/vision-api.jar"
          if jar tf "$DEST/vision-api.jar" | grep -Eq 'kotlin_module|UniversalVisionCompileProbe'; then
            echo "::error::Compile stub leaked Kotlin 2.4 metadata"; exit 1
          fi
      - name: Inspect consumer Kotlin compile dependencies
        run: gradle -p spikes/photo-83-1-interop-kt21 :consumer:dependencies --configuration debugCompileClasspath --no-daemon
      - name: Compile Kotlin 2.1 consuming the prebuilt Kotlin 2.4 AAR
        run: gradle -p spikes/photo-83-1-interop-kt21 :consumer:assembleDebug --no-daemon --stacktrace
      - name: Validate standalone ABI test APK
        shell: bash
        run: |
          set -euo pipefail
          APK=spikes/photo-83-1-interop-kt21/consumer/build/outputs/apk/debug/consumer-debug.apk
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          if "$AAPT" dump permissions "$APK" | grep -q 'android.permission.INTERNET'; then
            echo "::error::ABI probe must be offline"; exit 1
          fi
          unzip -Z1 "$APK" | grep -E '^classes[0-9]*.dex$'
          echo "Kotlin 2.1 Android APK compiled against Kotlin 2.4 AAR Java ABI. Runtime/Expo still NOT VERIFIED." >> "$GITHUB_STEP_SUMMARY"
