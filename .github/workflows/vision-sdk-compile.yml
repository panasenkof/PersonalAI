name: Vision SDK compile spike (isolated)

on:
  pull_request:
    paths:
      - "spikes/photo-83-1-android/**"
      - ".github/workflows/vision-sdk-compile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned image generator for deterministic offline test cases
        run: python -m pip install Pillow==11.3.0
      - name: Verify fixture labels, real JPEG files and photo-photo anchor
        run: python -m unittest discover -s spikes/photo-83-1-android/fixtures -p 'test_*.py' -v
      - name: Generate test JPEGs and package user-downloadable archive
        run: python spikes/photo-83-1-android/fixtures/generate.py spikes/photo-83-1-android/build/vision-fixtures
      - name: Upload 41 reproducible synthetic image cases
        uses: actions/upload-artifact@v4
        with:
          name: persai-vision-41-labeled-jpegs
          path: spikes/photo-83-1-android/build/vision-fixtures/PersAI_Vision_41_cases.zip
          if-no-files-found: error
          retention-days: 14
      - name: Fixture provenance
        run: |
          echo "41 synthetic illustrations and expected labels; reproducible source in fixtures/" >> "$GITHUB_STEP_SUMMARY"
          echo "Visual gallery is not a substitute for real-image Recall@K." >> "$GITHUB_STEP_SUMMARY"

  android-sdk-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Verify preinstalled Android SDK
        shell: bash
        run: |
          test -d "$ANDROID_HOME/platforms/android-35" || {
            echo "::error::Android SDK platform 35 not present on runner"; exit 1;
          }
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Compile SDK, JUnit diagnostics and offline lab APK
        run: gradle -p spikes/photo-83-1-android :probe:compileDebugKotlin :probe:assembleDebug :app:testDebugUnitTest :app:assembleDebug --no-daemon --stacktrace
      - name: Verify missing ActivationDataType is present in pinned LiteRT-LM 0.18.0 AAR
        shell: bash
        run: |
          ROOT="$HOME/.gradle/caches/modules-2/files-2.1/com.google.ai.edge.litertlm/litertlm-android/0.18.0"
          AAR="$(find "$ROOT" -type f -name '*.aar' -print -quit)"
          test -f "$AAR" || { echo "::error::LiteRT-LM 0.18.0 AAR not resolved"; exit 1; }
          unzip -p "$AAR" classes.jar > "$RUNNER_TEMP/litertlm-classes.jar"
          if ! jar tf "$RUNNER_TEMP/litertlm-classes.jar" |
            grep -Fx 'com/google/ai/edge/litertlm/ActivationDataType.class'; then
            echo "::error::Pinned LiteRT-LM AAR still lacks ActivationDataType"
            exit 1
          fi
          echo "LiteRT-LM 0.18.0 AAR contains ActivationDataType.class" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify APK permissions and inspect ARM64 native libraries
        shell: bash
        run: |
          APK="$(find spikes/photo-83-1-android/app/build/outputs/apk/debug -type f -name '*.apk' | head -1)"
          test -f "$APK" || { echo "::error::No debug APK built"; exit 1; }
          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$AAPT" || { echo "::error::Android aapt not found"; exit 1; }
          if "$AAPT" dump permissions "$APK" | grep -q 'android.permission.INTERNET'; then
            echo "::error::Offline lab must NOT request Internet permission"
            exit 1
          fi
          echo "### Packaged native libraries (ARM64)" >> "$GITHUB_STEP_SUMMARY"
          unzip -Z1 "$APK" | grep 'lib/arm64-v8a/' | head -40 >> "$GITHUB_STEP_SUMMARY" || true
      - name: Publish installable offline diagnostic lab APK
        uses: actions/upload-artifact@v4
        with:
          name: persai-vision-lab-android16-image-to-image
          path: spikes/photo-83-1-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Record proof boundary
        if: always()
        run: |
          echo "Offline Android 16 lab APK compiled; no weights or photos bundled." >> "$GITHUB_STEP_SUMMARY"
          echo "Missing-class diagnostics await real Vivo X200 Pro runtime validation." >> "$GITHUB_STEP_SUMMARY"
          echo "Main PersAI Kotlin toolchain and memory remain untouched." >> "$GITHUB_STEP_SUMMARY"
