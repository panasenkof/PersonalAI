name: Vision SDK compile spike (isolated)

on:
  pull_request:
    paths:
      - "spikes/photo-83-1-android/**"
      - ".github/workflows/vision-sdk-compile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-sdk-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"
      - name: Compile isolated Kotlin 2.4 MediaPipe API without model weights
        run: gradle -p spikes/photo-83-1-android :probe:compileDebugKotlin :probe:assembleDebug --no-daemon --stacktrace
      - name: Record proof boundary
        if: always()
        run: |
          echo "This is SDK ABI compilation only; no Android inference and no source images." >> "$GITHUB_STEP_SUMMARY"
          echo "PersAI main mobile Gradle config unchanged. Model weights not downloaded." >> "$GITHUB_STEP_SUMMARY"
