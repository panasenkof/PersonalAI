<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Восстановление доступа — PIA</title><link rel="stylesheet" href="styles.css"><link rel="icon" href="favicon.svg"></head><body style="height:auto;min-height:100dvh;padding:24px"><main style="width:min(480px,100%);margin:auto;display:block"><a href="./">← Войти в PIA</a><h1>Доступ к аккаунту</h1><p>Запросите письмо или используйте одноразовый код из полученного письма.</p><form id="requestForm"><label for="email">Email</label><input id="email" type="email" required autocomplete="email"><label for="purpose">Что нужно сделать?</label><select id="purpose"><option value="reset">Восстановить пароль</option><option value="verify">Подтвердить email</option></select><button style="margin:12px 0" id="requestButton">Отправить письмо</button></form><form id="finishForm"><label for="code">Одноразовый код из письма</label><input id="code" required minlength="20" autocomplete="off"><label for="newPassword">Новый пароль (для восстановления)</label><input id="newPassword" type="password" minlength="8" autocomplete="new-password"><label for="otp">Код 2FA или резервный код, если включена 2FA</label><input id="otp" autocomplete="one-time-code"><button style="margin:12px 0" id="finishButton">Подтвердить</button></form><p id="status" role="status"></p><p class="intro">Сброс пароля завершает все прежние сессии. Если потеряны и пароль, и резервные коды 2FA, обратитесь к владельцу сервиса.</p></main><script src="access.js" defer></script></body></html>
