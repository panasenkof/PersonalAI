<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIA Agent</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <b>PIA Agent</b>
  <span class="spacer"></span>
  <button class="ghost" id="btnSettings">Настройки LLM</button>
  <button class="ghost" id="btnLogout">Выйти</button>
</header>
<main>
  <aside>
    <button id="btnNew" style="width:100%;margin-bottom:10px">+ Новый чат</button>
    <div id="convList"></div>
  </aside>
  <section class="chat">
    <div id="chatbar">
      <span id="chatTitle">Новый чат</span>
      <button class="ghost danger hidden" id="btnDelete">🗑 Удалить чат</button>
    </div>
    <div id="msgs"></div>
    <div id="composer">
      <textarea id="input" placeholder="Спросите или попросите запомнить… (Enter — отправить, Shift+Enter — новая строка)"></textarea>
      <button id="btnSend">Отправить</button>
    </div>
  </section>
</main>

<!-- auth -->
<div class="overlay" id="authView">
  <div class="card">
    <h2>Вход в PIA</h2>
    <input id="email" placeholder="email" autocomplete="username">
    <input id="password" type="password" placeholder="пароль (мин. 8)" autocomplete="current-password">
    <input id="otp" class="hidden" placeholder="код 2FA (или резервный код)" autocomplete="one-time-code" inputmode="numeric">
    <button id="btnLogin">Войти</button>
    <button class="ghost" id="btnRegister">Зарегистрироваться</button>
    <div id="authErr" class="err"></div>
  </div>
</div>

<!-- settings -->
<div class="overlay hidden" id="settingsView">
  <div class="card" id="settings">
    <h2>Настройки LLM</h2>
    <div class="row"><label>Провайдер</label>
      <select id="sProvider"><option value="cloud">Облачный</option><option value="local">Локальный</option></select></div>
    <div class="row"><label>Base URL (OpenAI-compatible)</label><input id="sBase" placeholder="https://api.openai.com/v1"></div>
    <div class="row"><label>API-ключ (пусто = не менять)</label><input id="sKey" type="password" placeholder="sk-…"></div>
    <div class="row"><label>Модель</label><input id="sModel" placeholder="gpt-4o-mini"></div>
    <div class="row"><label>Модель эмбеддингов</label><input id="sEmb" placeholder="text-embedding-3-small"></div>
    <div style="display:flex;gap:8px">
      <button id="btnSaveSettings">Сохранить</button>
      <button class="ghost" id="btnCloseSettings">Закрыть</button>
    </div>
    <div id="setMsg"></div>
    <div id="setStats"></div>
    <div class="sec" id="secBox">
      <h3>Безопасность</h3>
      <div id="secStatus" class="ok"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="ghost" id="btn2faSetup">Включить 2FA</button>
        <button class="ghost" id="btnLogoutAll">Выйти на всех устройствах</button>
      </div>
      <div id="twofaBox" class="hidden" style="display:flex;flex-direction:column;gap:8px">
        <div>Добавьте секрет в приложение-аутентификатор и введите код:</div>
        <pre id="twofaSecret"></pre>
        <input id="twofaCode" placeholder="6-значный код" inputmode="numeric">
        <button id="btn2faEnable">Подтвердить</button>
      </div>
      <div id="twofaOff" class="hidden" style="display:flex;flex-direction:column;gap:8px">
        <input id="offPass" type="password" placeholder="пароль">
        <input id="offCode" placeholder="код 2FA">
        <button class="danger" id="btn2faDisable">Отключить 2FA</button>
      </div>
      <pre id="recoveryBox" class="hidden"></pre>
      <h3>Мессенджеры</h3>
      <div style="display:flex;gap:8px">
        <select id="chSel"><option>telegram</option><option>slack</option><option>whatsapp</option><option>discord</option></select>
        <button class="ghost" id="btnLinkCode">Код привязки</button>
      </div>
      <pre id="linkBox" class="hidden"></pre>
    </div>
  </div>
</div>

<script src="app.js" defer></script>
</body>
</html>
