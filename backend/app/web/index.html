<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIA Agent</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --text:#e6e9ef; --muted:#8b93a5; --accent:#4f8cff; --ok:#3ecf8e; --err:#ff7b7b; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:12px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--line); }
  header b { font-size:16px; } header .spacer { flex:1; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:8px 14px; cursor:pointer; font:inherit; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--text); }
  button.danger { background:#7b2d2d; }
  button:disabled { opacity:.5; cursor:default; }
  main { flex:1; display:flex; min-height:0; }
  aside { width:240px; background:var(--panel); border-right:1px solid var(--line); overflow:auto; padding:10px; }
  aside .conv { padding:8px 10px; border-radius:8px; cursor:pointer; color:var(--muted); margin-bottom:4px; display:flex; align-items:center; gap:6px; }
  aside .conv:hover { background:#1e2330; }
  aside .conv.active { background:#232a3a; color:var(--text); }
  aside .conv span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; }
  section.chat { flex:1; display:flex; flex-direction:column; min-width:0; }
  #chatbar { display:flex; align-items:center; gap:10px; padding:8px 16px; border-bottom:1px solid var(--line); background:#12151c; }
  #chatTitle { flex:1; color:var(--muted); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #msgs { flex:1; overflow:auto; padding:20px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:760px; padding:10px 14px; border-radius:12px; white-space:pre-wrap; word-break:break-word; }
  .msg.user { background:#27406e; align-self:flex-end; }
  .msg.assistant { background:var(--panel); border:1px solid var(--line); align-self:flex-start; }
  .msg.meta { align-self:center; color:var(--muted); font-size:12px; background:none; border:0; text-align:center; }
  .msg code { background:#0c0e12; padding:1px 5px; border-radius:4px; font-family:ui-monospace,monospace; font-size:.92em; }
  .msg strong { color:#ffd479; }
  .msg em { color:#9ecbff; }
  .ts { display:block; text-align:right; font-size:10px; color:var(--muted); margin-top:4px; }
  .thinking::after { content:"…"; animation: dots 1.2s steps(4) infinite; }
  @keyframes dots { 0%{content:""} 25%{content:"."} 50%{content:".."} 75%{content:"..."} }
  #composer { display:flex; gap:8px; padding:14px; border-top:1px solid var(--line); }
  #composer textarea { flex:1; resize:none; height:52px; background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:10px; padding:10px; font:inherit; }
  textarea:focus, input:focus, select:focus { outline:1px solid var(--accent); }
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:center; justify-content:center; z-index:10; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:24px; width:380px; max-height:90vh; overflow:auto; display:flex; flex-direction:column; gap:10px; }
  .card h2 { margin:0 0 6px; font-size:18px; }
  input, select { background:#12151c; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:9px 10px; font:inherit; width:100%; }
  .hidden { display:none !important; }
  .tool-chip { font-size:12px; color:var(--muted); border:1px dashed var(--line); border-radius:20px; padding:2px 10px; align-self:flex-start; }
  #settings .row { display:flex; flex-direction:column; gap:4px; }
  #settings label { font-size:12px; color:var(--muted); }
  #setStats { font-size:12px; color:var(--muted); border-top:1px dashed var(--line); padding-top:8px; line-height:1.7; }
  .tool-chip.run { color:var(--accent); border-color:var(--accent); }
  .tool-chip.ok { color:var(--ok); border-style:solid; }
  .tool-chip.bad { color:var(--err); border-style:solid; }
  .tool-chip small { opacity:.7; margin-left:4px; }
  .fact { align-self:flex-start; max-width:760px; border:1px solid #6b5a1f; background:#2a2412; border-radius:12px; padding:10px 14px; display:flex; flex-direction:column; gap:8px; }
  .fact .actions { display:flex; gap:8px; }
  .fact .state { font-size:13px; color:var(--muted); }
  #btnSend.stop { background:#b03a3a; }
  .sec { border-top:1px dashed var(--line); padding-top:10px; display:flex; flex-direction:column; gap:8px; }
  .sec h3 { margin:0; font-size:14px; }
  .sec pre { margin:0; background:#0c0e12; padding:8px; border-radius:8px; font-size:12px; white-space:pre-wrap; word-break:break-all; }
  .err { color:var(--err); font-size:13px; }
  .ok { color:var(--ok); font-size:13px; }
</style>
</head>
<body>
<header>
  <b>PIA Agent</b>
  <span class="spacer"></span>
  <button class="ghost" id="btnSettings">Настройки LLM</button>
  <button class="ghost" id="btnLogout">Выйти</button>
</header>
<main>
  <aside>
    <button id="btnNew" style="width:100%;margin-bottom:10px">+ Новый чат</button>
    <div id="convList"></div>
  </aside>
  <section class="chat">
    <div id="chatbar">
      <span id="chatTitle">Новый чат</span>
      <button class="ghost danger hidden" id="btnDelete">🗑 Удалить чат</button>
    </div>
    <div id="msgs"></div>
    <div id="composer">
      <textarea id="input" placeholder="Спросите или попросите запомнить… (Enter — отправить, Shift+Enter — новая строка)"></textarea>
      <button id="btnSend">Отправить</button>
    </div>
  </section>
</main>

<!-- auth -->
<div class="overlay" id="authView">
  <div class="card">
    <h2>Вход в PIA</h2>
    <input id="email" placeholder="email" autocomplete="username">
    <input id="password" type="password" placeholder="пароль (мин. 8)" autocomplete="current-password">
    <input id="otp" class="hidden" placeholder="код 2FA (или резервный код)" autocomplete="one-time-code" inputmode="numeric">
    <button id="btnLogin">Войти</button>
    <button class="ghost" id="btnRegister">Зарегистрироваться</button>
    <div id="authErr" class="err"></div>
  </div>
</div>

<!-- settings -->
<div class="overlay hidden" id="settingsView">
  <div class="card" id="settings">
    <h2>Настройки LLM</h2>
    <div class="row"><label>Провайдер</label>
      <select id="sProvider"><option value="cloud">Облачный</option><option value="local">Локальный</option></select></div>
    <div class="row"><label>Base URL (OpenAI-compatible)</label><input id="sBase" placeholder="https://api.openai.com/v1"></div>
    <div class="row"><label>API-ключ (пусто = не менять)</label><input id="sKey" type="password" placeholder="sk-…"></div>
    <div class="row"><label>Модель</label><input id="sModel" placeholder="gpt-4o-mini"></div>
    <div class="row"><label>Модель эмбеддингов</label><input id="sEmb" placeholder="text-embedding-3-small"></div>
    <div style="display:flex;gap:8px">
      <button id="btnSaveSettings">Сохранить</button>
      <button class="ghost" id="btnCloseSettings">Закрыть</button>
    </div>
    <div id="setMsg"></div>
    <div id="setStats"></div>
    <div class="sec" id="secBox">
      <h3>Безопасность</h3>
      <div id="secStatus" class="ok"></div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="ghost" id="btn2faSetup">Включить 2FA</button>
        <button class="ghost" id="btnLogoutAll">Выйти на всех устройствах</button>
      </div>
      <div id="twofaBox" class="hidden" style="display:flex;flex-direction:column;gap:8px">
        <div>Добавьте секрет в приложение-аутентификатор и введите код:</div>
        <pre id="twofaSecret"></pre>
        <input id="twofaCode" placeholder="6-значный код" inputmode="numeric">
        <button id="btn2faEnable">Подтвердить</button>
      </div>
      <div id="twofaOff" class="hidden" style="display:flex;flex-direction:column;gap:8px">
        <input id="offPass" type="password" placeholder="пароль">
        <input id="offCode" placeholder="код 2FA">
        <button class="danger" id="btn2faDisable">Отключить 2FA</button>
      </div>
      <pre id="recoveryBox" class="hidden"></pre>
      <h3>Мессенджеры</h3>
      <div style="display:flex;gap:8px">
        <select id="chSel"><option>telegram</option><option>slack</option><option>whatsapp</option><option>discord</option></select>
        <button class="ghost" id="btnLinkCode">Код привязки</button>
      </div>
      <pre id="linkBox" class="hidden"></pre>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const AUTH_PATHS = new Set(["/v1/auth/token", "/v1/auth/register", "/v1/auth/refresh"]);
let token = localStorage.getItem("pia_token") || "";
let conversations = [];
let currentConv = null;
let busy = false;

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function logout() {
  token = "";
  localStorage.removeItem("pia_token");
  localStorage.removeItem("pia_refresh");
  $("authView").classList.remove("hidden");
}

async function tryRefresh() {
  const rt = localStorage.getItem("pia_refresh");
  if (!rt) return false;
  try {
    const r = await fetch("/v1/auth/refresh", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ refresh_token: rt }),
    });
    if (!r.ok) return false;
    const j = await r.json();
    token = j.access_token;
    localStorage.setItem("pia_token", token);
    if (j.refresh_token) localStorage.setItem("pia_refresh", j.refresh_token);
    return true;
  } catch (e) { return false; }
}

async function api(path, opts = {}, allowRefresh = true) {
  opts = { ...opts, headers: { ...(opts.headers || {}) } };
  if (token) opts.headers["Authorization"] = "Bearer " + token;
  if (opts.body && typeof opts.body !== "string") {
    opts.headers["Content-Type"] = "application/json";
    opts.body = JSON.stringify(opts.body);
  }
  const r = await fetch(path, opts);
  if (r.status === 401 && allowRefresh && !AUTH_PATHS.has(path)) {
    if (await tryRefresh()) return api(path, opts, false);
    logout();
    throw new Error("сессия истекла — войдите снова");
  }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.detail ? JSON.stringify(data.detail) : ("HTTP " + r.status));
  return data;
}

async function loginOrRegister(register) {
  $("authErr").textContent = "";
  try {
    const path = register ? "/v1/auth/register" : "/v1/auth/token";
    const body = { email: $("email").value.trim(), password: $("password").value };
    if (!$("otp").classList.contains("hidden") && $("otp").value.trim()) body.otp = $("otp").value.trim();
    const data = await api(path, { method: "POST", body });
    token = data.access_token;
    localStorage.setItem("pia_token", token);
    if (data.refresh_token) localStorage.setItem("pia_refresh", data.refresh_token);
    $("authView").classList.add("hidden");
    $("otp").value = ""; $("otp").classList.add("hidden");
    await boot();
  } catch (e) {
    const m = String(e.message || e);
    if (m.includes("otp_required")) {
      $("otp").classList.remove("hidden"); $("otp").focus();
      $("authErr").textContent = "Введите код двухфакторной аутентификации";
    } else if (m.includes("too_many_failed_attempts")) {
      $("authErr").textContent = "Слишком много неудачных попыток — попробуйте позже";
    } else { $("authErr").textContent = m; }
  }
}

// ---------- rendering ----------
function renderRich(text) {
  // escape first, then apply a tiny markdown subset (**bold** `code` *italic*)
  const esc = String(text).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  return esc
    .replace(/\*\*([^*\n]+)\*\*/g, "<strong>$1</strong>")
    .replace(/`([^`\n]+)`/g, "<code>$1</code>")
    .replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g, "$1<em>$2</em>");
}

function addMsg(role, text, when) {
  const d = document.createElement("div");
  d.className = "msg " + role;
  if (role === "meta") {
    d.textContent = text;
  } else {
    d.innerHTML = renderRich(text);
    const ts = document.createElement("span");
    ts.className = "ts";
    ts.textContent = new Date(when || Date.now()).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    d.appendChild(ts);
    d.title = new Date(when || Date.now()).toLocaleString();
  }
  $("msgs").appendChild(d);
  $("msgs").scrollTop = $("msgs").scrollHeight;
  return d;
}
function addMeta(text) { return addMsg("meta", text); }

function setChatbar() {
  $("chatTitle").textContent = currentConv ? (currentConv.title || "Чат") : "Новый чат";
  $("btnDelete").classList.toggle("hidden", !currentConv);
}

// ---------- conversations ----------
async function loadConversations() {
  conversations = await api("/v1/conversations");
  const box = $("convList");
  box.innerHTML = "";
  conversations.forEach((c) => {
    const d = document.createElement("div");
    d.className = "conv" + (currentConv && currentConv.id === c.id ? " active" : "");
    const s = document.createElement("span");
    s.textContent = c.title || "Без названия";
    d.appendChild(s);
    d.title = c.title || "";
    d.onclick = () => openConversation(c);
    box.appendChild(d);
  });
}

function newChat() {
  currentConv = null;
  $("msgs").innerHTML = "";
  addMeta("Новый чат — история сохраняется автоматически");
  setChatbar();
  loadConversations();
}

async function openConversation(c) {
  currentConv = c;
  $("msgs").innerHTML = "";
  setChatbar();
  const turns = await api(`/v1/conversations/${c.id}/messages`);
  turns.forEach((t) => addMsg(t.role, t.content, t.created_at));
  await loadConversations();
}

async function deleteCurrent() {
  if (!currentConv) return;
  if (!confirm("Удалить чат «" + (currentConv.title || "Без названия") + "»?")) return;
  try {
    await api(`/v1/conversations/${currentConv.id}`, { method: "DELETE" });
    newChat();
  } catch (e) { addMeta("Ошибка удаления: " + (e.message || e)); }
}

async function boot() {
  try { await api("/v1/settings/llm"); } catch (e) {}
  await loadConversations();
  newChat();
  try {
    const f = await api("/v1/facts");
    if (f.facts && f.facts.length) { addMeta("Ожидают вашего подтверждения:"); renderFacts(f.facts); }
  } catch (e) {}
}

// ---------- sending + streaming ----------
function showThinking() {
  const d = document.createElement("div");
  d.className = "msg meta thinking";
  d.id = "thinking";
  d.textContent = "думаю";
  $("msgs").appendChild(d);
  $("msgs").scrollTop = $("msgs").scrollHeight;
  return d;
}
function hideThinking() { const t = $("thinking"); if (t) t.remove(); }

let activeJob = null;

function setBusy(on, jobId) {
  busy = on;
  activeJob = on ? (jobId || activeJob) : null;
  const b = $("btnSend");
  if (on && activeJob) { b.textContent = "⏹ Стоп"; b.classList.add("stop"); b.disabled = false; }
  else { b.textContent = "Отправить"; b.classList.remove("stop"); b.disabled = on; }
}

async function stopGeneration() {
  if (!activeJob) return;
  const id = activeJob;
  $("btnSend").disabled = true;
  try { await api(`/v1/jobs/${id}/cancel`, { method: "POST" }); } catch (e) { addMeta("Не удалось остановить: " + (e.message || e)); }
}

function renderFacts(facts) {
  (facts || []).forEach((f) => {
    const box = document.createElement("div");
    box.className = "fact";
    const t = document.createElement("div");
    t.innerHTML = "📝 <b>Проверьте распознанные данные</b><br>" + renderRich(f.summary || f.kind || "");
    const actions = document.createElement("div");
    actions.className = "actions";
    const state = document.createElement("div");
    state.className = "state";
    const act = async (kind) => {
      actions.querySelectorAll("button").forEach((b) => (b.disabled = true));
      try {
        await api(`/v1/facts/${f.id}/${kind}`, { method: "POST" });
        actions.remove();
        state.textContent = kind === "confirm" ? "✅ Сохранено в базе знаний" : "❌ Отклонено";
      } catch (e) {
        actions.querySelectorAll("button").forEach((b) => (b.disabled = false));
        state.textContent = "Ошибка: " + (e.message || e);
      }
    };
    const ok = document.createElement("button"); ok.textContent = "✅ Подтвердить"; ok.onclick = () => act("confirm");
    const no = document.createElement("button"); no.className = "ghost"; no.textContent = "❌ Отклонить"; no.onclick = () => act("reject");
    actions.append(ok, no);
    box.append(t, actions, state);
    $("msgs").appendChild(box);
  });
  $("msgs").scrollTop = $("msgs").scrollHeight;
}

async function send() {
  if (busy) { stopGeneration(); return; }
  const text = $("input").value.trim();
  if (!text) return;
  setBusy(true);
  $("input").value = "";
  addMsg("user", text);
  showThinking();
  try {
    const body = { text, channel: "mobile" };
    if (currentConv) body.conversation_id = currentConv.id;
    const res = await api("/v1/messages", { method: "POST", body });
    if (res.conversation_id && (!currentConv || currentConv.id !== res.conversation_id)) {
      currentConv = { id: res.conversation_id, title: text.slice(0, 80) };
      setChatbar();
      loadConversations();
    }
    if (res.assistant_text) {
      hideThinking();
      addMsg("assistant", res.assistant_text);
      renderFacts(res.pending_facts);
    } else if (res.job_id) {
      hideThinking();
      setBusy(true, res.job_id);
      await streamJob(res.job_id);
    }
  } catch (e) {
    hideThinking();
    const m = String(e.message || e);
    addMeta(m.includes("rate_limited") ? "Слишком много запросов — подождите минуту" : "Ошибка: " + m);
  } finally {
    hideThinking();
    setBusy(false);
    $("input").focus();
  }
}

function bubbleText(bubble) {
  return Array.from(bubble.childNodes).filter((n) => n.nodeType === 3).map((n) => n.textContent).join("");
}
function clearBubble(bubble) {
  Array.from(bubble.childNodes).forEach((n) => { if (n.nodeType === 3) n.remove(); });
}

async function pollJob(jobId, bubble) {
  // Fallback when SSE drops: poll the job until it reaches a terminal state.
  if (!bubbleText(bubble)) clearBubble(bubble), bubble.insertBefore(document.createTextNode("(соединение прервано — переключаюсь на опрос…)"), bubble.querySelector(".ts"));
  for (let i = 0; i < 180; i++) {
    await sleep(1000);
    let job;
    try { job = await api(`/v1/jobs/${jobId}`); } catch (e) { continue; }
    if (job.status === "completed" || job.status === "awaiting_confirm") {
      const text = job.result && job.result.assistant_text;
      if (text) { clearBubble(bubble); bubble.insertBefore(document.createTextNode(text), bubble.querySelector(".ts")); }
      renderFacts(job.pending_facts);
      return;
    }
    if (job.status === "cancelled") { addMeta("Остановлено"); return; }
    if (job.status === "failed") {
      bubble.textContent = "Ошибка: " + (job.error || "задача не удалась");
      return;
    }
  }
  bubble.textContent = "Таймаут: ответ не пришёл за 3 минуты";
}

function streamJob(jobId) {
  return new Promise((resolve) => {
    let settled = false;
    const bubble = addMsg("assistant", "");
    const chips = {}; // index/name → chip element (live tool-call construction)
    let lastChip = null;
    const finish = () => {
      if (settled) return;
      settled = true;
      try { es.close(); } catch (e) {}
      if (!bubbleText(bubble).trim() && !bubble.classList.contains("err")) bubble.remove();
      resolve();
    };
    let es;
    const parse = (ev) => { try { return JSON.parse(ev.data); } catch (e) { return {}; } };
    const scroll = () => { $("msgs").scrollTop = $("msgs").scrollHeight; };
    const chipFor = (key) => {
      let chip = chips[key];
      if (!chip) {
        chip = document.createElement("div");
        chip.className = "tool-chip run";
        (lastChip || bubble).after(chip);
        lastChip = chip;
        chips[key] = chip;
      }
      return chip;
    };
    try {
      es = new EventSource(`/v1/jobs/${jobId}/events?access_token=${encodeURIComponent(token)}`);
    } catch (e) {
      pollJob(jobId, bubble).then(finish);
      return;
    }
    es.addEventListener("token", (ev) => {
      if (settled) return;
      bubble.insertBefore(document.createTextNode(parse(ev).content || ""), bubble.querySelector(".ts"));
      scroll();
    });
    es.addEventListener("reset", () => clearBubble(bubble));
    // the model is composing a tool call: name + arguments appear while they stream in
    const args = {};
    es.addEventListener("tool_call", (ev) => {
      if (settled) return;
      const d = parse(ev);
      const key = "call" + d.index;
      args[key] = (args[key] || "") + (d.arguments_delta || "");
      const chip = chipFor(key);
      chip.textContent = "⚙ " + (d.name || "…") + " " + args[key].slice(0, 80);
      scroll();
    });
    es.addEventListener("tool_start", (ev) => {
      if (settled) return;
      const d = parse(ev);
      clearBubble(bubble); // text before a tool call is a preamble; the final answer follows
      // reuse the chip created from streamed deltas, otherwise create a new one
      const key = Object.keys(chips).find((k) => chips[k].dataset.name === undefined && chips[k].textContent.includes(d.name)) || ("t" + Date.now() + Math.random());
      const chip = chipFor(key);
      chip.dataset.name = d.name;
      chip.dataset.key = key;
      chip.className = "tool-chip run";
      chip.textContent = "⏳ " + d.name + " " + (d.arguments || "").slice(0, 80);
      scroll();
    });
    es.addEventListener("tool", (ev) => {
      if (settled) return;
      const d = parse(ev);
      const running = Object.values(chips).find((c) => c.dataset.name === d.name && c.classList.contains("run"));
      const chip = running || chipFor("done" + Date.now() + Math.random());
      chip.className = "tool-chip " + (d.ok === false ? "bad" : "ok");
      chip.innerHTML = "";
      chip.append((d.ok === false ? "✖ " : "✔ ") + d.name + (d.summary ? " — " + d.summary : ""));
      if (d.ms != null) { const m = document.createElement("small"); m.textContent = d.ms + " мс"; chip.append(m); }
      scroll();
    });
    es.addEventListener("done", (ev) => {
      if (settled) return;
      const d = parse(ev);
      if (d.text && !bubbleText(bubble).trim()) bubble.insertBefore(document.createTextNode(d.text), bubble.querySelector(".ts"));
      renderFacts(d.pending_facts);
      finish();
    });
    es.addEventListener("cancelled", () => {
      if (settled) return;
      addMeta("⏹ Остановлено" + (bubbleText(bubble).trim() ? " — частичный ответ сохранён" : ""));
      finish();
    });
    es.addEventListener("error", (ev) => {
      if (settled) return;
      if (ev.data) {
        // server-sent error event (has payload)
        bubble.textContent = "Ошибка: " + (parse(ev).text || "неизвестная ошибка");
        bubble.classList.add("err");
        finish();
        return;
      }
      // native connection error / stream EOF → poll as a fallback
      try { es.close(); } catch (e) {}
      pollJob(jobId, bubble).then(finish);
    });
  });
}

// ---------- settings ----------
async function loadSettings() {
  try {
    const s = await api("/v1/settings/llm");
    $("sProvider").value = s.provider_kind;
    $("sBase").value = s.base_url;
    $("sModel").value = s.default_model;
    $("sEmb").value = s.embedding_model || "";
  } catch (e) {}
  try {
    const st = await api("/v1/stats");
    const u = st.usage_tokens || {};
    $("setStats").innerHTML =
      "📊 Статистика: джобов — <b>" + Object.values(st.jobs || {}).reduce((a, b) => a + b, 0) +
      "</b>, чатов — <b>" + st.conversations +
      "</b>, сообщений — <b>" + st.chat_turns +
      "</b>, сущностей — <b>" + st.entities +
      "</b>, наблюдений — <b>" + st.observations +
      "</b><br>Токены: prompt <b>" + u.prompt + "</b> / completion <b>" + u.completion + "</b>";
  } catch (e) { $("setStats").textContent = ""; }
}

async function loadSecurity() {
  try {
    const me = await api("/v1/auth/me");
    $("secStatus").textContent = "2FA: " + (me.totp_enabled ? "включена" : "выключена") + " · роль: " + me.role;
    $("btn2faSetup").classList.toggle("hidden", me.totp_enabled);
    $("twofaOff").classList.toggle("hidden", !me.totp_enabled);
    $("twofaBox").classList.add("hidden");
  } catch (e) {}
}
async function twofaSetup() {
  try {
    const r = await api("/v1/auth/2fa/setup", { method: "POST" });
    $("twofaSecret").textContent = r.secret + "\n" + r.otpauth_uri;
    $("twofaBox").classList.remove("hidden");
  } catch (e) { $("setMsg").className = "err"; $("setMsg").textContent = String(e.message || e); }
}
async function twofaEnable() {
  try {
    const r = await api("/v1/auth/2fa/enable", { method: "POST", body: { code: $("twofaCode").value.trim() } });
    $("recoveryBox").textContent = "Резервные коды (сохраните, каждый работает один раз):\n" + r.recovery_codes.join("\n");
    $("recoveryBox").classList.remove("hidden");
    $("twofaCode").value = "";
    await loadSecurity();
  } catch (e) { $("setMsg").className = "err"; $("setMsg").textContent = String(e.message || e); }
}
async function twofaDisable() {
  try {
    await api("/v1/auth/2fa/disable", { method: "POST", body: { password: $("offPass").value, code: $("offCode").value.trim() } });
    $("offPass").value = ""; $("offCode").value = "";
    $("recoveryBox").classList.add("hidden");
    await loadSecurity();
  } catch (e) { $("setMsg").className = "err"; $("setMsg").textContent = String(e.message || e); }
}
async function logoutAll() {
  try { await api("/v1/auth/logout-all", { method: "POST" }); } catch (e) {}
  logout();
  $("settingsView").classList.add("hidden");
}
async function linkCode() {
  try {
    const r = await api(`/v1/channels/${$("chSel").value}/link-code`, { method: "POST" });
    $("linkBox").textContent = r.code + "\n" + (r.instructions || "");
    $("linkBox").classList.remove("hidden");
  } catch (e) { $("setMsg").className = "err"; $("setMsg").textContent = String(e.message || e); }
}

async function saveSettings() {
  const msg = $("setMsg");
  msg.className = ""; msg.textContent = "";
  const body = {
    provider_kind: $("sProvider").value,
    base_url: $("sBase").value.trim(),
    default_model: $("sModel").value.trim(),
    embedding_model: $("sEmb").value.trim() || null,
  };
  const key = $("sKey").value.trim();
  if (key) body.api_key = key;
  try {
    await api("/v1/settings/llm", { method: "PATCH", body });
    msg.className = "ok";
    msg.textContent = "Сохранено ✔";
    $("sKey").value = "";
    loadSettings();
  } catch (e) { msg.className = "err"; msg.textContent = String(e.message || e); }
}

// ---------- wiring ----------
$("btnLogin").onclick = () => loginOrRegister(false);
$("btnRegister").onclick = () => loginOrRegister(true);
$("btnSend").onclick = send;
$("btnNew").onclick = newChat;
$("btnDelete").onclick = deleteCurrent;
$("btnLogout").onclick = logout;
$("btnSettings").onclick = () => { $("settingsView").classList.remove("hidden"); $("setMsg").className = ""; loadSettings(); loadSecurity(); };
$("btn2faSetup").onclick = twofaSetup;
$("btn2faEnable").onclick = twofaEnable;
$("btn2faDisable").onclick = twofaDisable;
$("btnLogoutAll").onclick = logoutAll;
$("btnLinkCode").onclick = linkCode;
$("btnCloseSettings").onclick = () => $("settingsView").classList.add("hidden");
$("btnSaveSettings").onclick = saveSettings;
$("input").addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });

if (token) { $("authView").classList.add("hidden"); boot(); }
</script>
