x-app-env: &app-env
  APP_ENV: production
  REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
  REGISTRATION_ALLOWED_EMAILS: ${REGISTRATION_ALLOWED_EMAILS:-}
  ENABLED_DOMAINS: ${ENABLED_DOMAINS-automotive,medical_labs}
  AGENT_CONTEXT_MAX_CHARS: ${AGENT_CONTEXT_MAX_CHARS:-100000}
  TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
  PUBLIC_LAUNCH: ${PUBLIC_LAUNCH:-false}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
  OPERATOR_NAME: ${OPERATOR_NAME:-}
  SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
  PRIVACY_URL: ${PRIVACY_URL:-}
  TERMS_URL: ${TERMS_URL:-}
  REQUIRE_VERIFIED_EMAIL: ${REQUIRE_VERIFIED_EMAIL:-false}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  SMTP_SSL: ${SMTP_SSL:-false}
  DEFAULT_LLM_BASE_URL: ${DEFAULT_LLM_BASE_URL:-https://api.openai.com/v1}
  DEFAULT_LLM_API_KEY: ${DEFAULT_LLM_API_KEY:-}
  DEFAULT_LLM_MODEL: ${DEFAULT_LLM_MODEL:-gpt-4o-mini}
  ACCOUNT_EXPORT_MAX_BYTES: ${ACCOUNT_EXPORT_MAX_BYTES:-104857600}
  EMAIL_ACTION_REQUESTS_PER_HOUR: ${EMAIL_ACTION_REQUESTS_PER_HOUR:-3}
  BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
  DELETION_JOURNAL_PATH: /app/data/deletions/accounts.log
  POSTGRES_HOST: postgres
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
  REDIS_URL: redis://redis:6379/0
  QUEUE_BACKEND: redis
  MESSAGE_MODE: queue
  QUEUE_CONCURRENCY: ${QUEUE_CONCURRENCY:-4}
  PGVECTOR_DIMENSIONS: ${PGVECTOR_DIMENSIONS:-1536}
  EMBEDDING_REVISION: ${EMBEDDING_REVISION:-1}
  DEFAULT_EMBEDDING_MODEL: ${DEFAULT_EMBEDDING_MODEL:-text-embedding-3-small}
  FALLBACK_API_KEY: ${FALLBACK_API_KEY:-}
  LLM_ALLOW_LOCAL_FALLBACK: ${LLM_ALLOW_LOCAL_FALLBACK:-false}
  JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET (>= 32 random chars) in .env}
  JWT_SECRET_PREVIOUS: ${JWT_SECRET_PREVIOUS:-}
  PIA_AGENT_SECRET: ${PIA_AGENT_SECRET:?set PIA_AGENT_SECRET (Fernet key) in .env}
  LLM_ALLOWED_BASE_URLS: ${LLM_ALLOWED_BASE_URLS:-https://api.openai.com/v1}
  FALLBACK_BASE_URL: ${FALLBACK_BASE_URL:-https://api.openai.com/v1}
  FALLBACK_MODEL: ${FALLBACK_MODEL:-gpt-4o-mini}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
  BLOB_STORAGE_DIR: /app/data/blobs
  RATE_LIMIT_AUTH_PER_MINUTE: ${RATE_LIMIT_AUTH_PER_MINUTE:-10}
  TRUST_PROXY_HEADERS: "true"  # only the proxy exposes an HTTP port and replaces X-Forwarded-For
  RATE_LIMIT_LLM_PER_MINUTE: ${RATE_LIMIT_LLM_PER_MINUTE:-30}
  MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
  MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
  MAX_API_BASE_URL: ${MAX_API_BASE_URL:-https://platform-api2.max.ru}
  MAX_MEDIA_ALLOWED_HOSTS: ${MAX_MEDIA_ALLOWED_HOSTS:-max.ru,ok.ru,userapi.com}
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
  SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
  SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET:-}
  WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
  WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:-}
  WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
  DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:-}
  DISCORD_PUBLIC_KEY: ${DISCORD_PUBLIC_KEY:-}
  DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
  STT_BASE_URL: ${STT_BASE_URL:-}
  STT_API_KEY: ${STT_API_KEY:-}

services:
  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *app-env
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy

  https:
    image: caddy:2-alpine
    profiles: [public]
    ports: ["80:80", "443:443"]
    environment:
      PIA_DOMAIN: ${PIA_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      app:
        condition: service_healthy

  proxy:
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16   # Postgres + pgvector (HNSW vector search)
    environment:
      POSTGRES_USER: pia
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: pia
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pia"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]   # jobs survive a Redis restart too
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # API replicas: accept requests, stream SSE, enqueue jobs. Scale with `--scale app=N`.
  app:
    build: ./backend
    expose:
      - "8000"
    environment:
      <<: *app-env
      EMBEDDED_WORKER: "false"        # jobs are executed by the dedicated workers below
      REMINDERS_ENABLED: ${REMINDERS_ENABLED:-true}
    volumes:
      - blobs:/app/data/blobs
      - deletions:/app/data/deletions
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Queue workers: run agent jobs. Scale independently with `--scale worker=N`.
  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    healthcheck:
      test: ["CMD", "python", "-m", "app.queue.health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    environment:
      <<: *app-env
      REMINDERS_ENABLED: "false"
    volumes:
      - blobs:/app/data/blobs
      - deletions:/app/data/deletions
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  blobs:
  deletions:
  caddydata:
  caddyconfig:
