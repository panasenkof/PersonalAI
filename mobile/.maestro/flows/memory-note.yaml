appId: com.paigent.app
name: PersAI native note persistence
---
- launchApp:
    clearState: true
- runFlow: ../unlock.yaml
- tapOn: "Вкладка Память"
- tapOn: "Новая заметка"
- extendedWaitUntil:
    visible:
      id: "note-title-input"
    timeout: 15000
- tapOn:
    id: "note-title-input"
- inputText: "Native QA note"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "note-body-input"
    direction: DOWN
- tapOn:
    id: "note-body-input"
- inputText: "Saved offline"
- hideKeyboard
- assertVisible: "Несохранённые изменения"
- tapOn:
    id: "note-save-button"
- extendedWaitUntil:
    visible: "Открыть заметку Native QA note"
    timeout: 15000
- tapOn: "Открыть заметку Native QA note"
- extendedWaitUntil:
    visible:
      id: "note-body-input"
    timeout: 15000
- assertVisible: "Saved offline"
# The editor field was just confirmed visible. On Android, hideKeyboard with no
# keyboard open can act as Back and pop the editor; never invoke it here.
- tapOn:
    id: "note-body-input"
- eraseText
- inputText: "Edited offline"
- hideKeyboard
- tapOn:
    id: "note-save-button"
- extendedWaitUntil:
    visible: "Открыть заметку Native QA note"
    timeout: 15000
- tapOn: "Открыть заметку Native QA note"
- assertVisible: "Edited offline"
- takeScreenshot: native-memory-persistence
