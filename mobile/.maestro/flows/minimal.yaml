appId: com.persai.app
name: PersAI mandatory minimal native smoke
---
# Security is never mocked or bypassed.
- launchApp:
    clearState: true
- runFlow: ../unlock.yaml
# A working native composer and retained draft across tabs.
- tapOn: "Сообщение ассистенту"
- inputText: "Smoke draft"
- assertVisible: "Очистить сообщение"
- hideKeyboard
- tapOn: "Вкладка Память"
- extendedWaitUntil:
    visible: "Добавить в память"
    timeout: 15000
- tapOn: "Вкладка Настройки"
- tapOn: "Вкладка Главная"
- assertVisible: "Smoke draft"
- takeScreenshot: minimal-home
