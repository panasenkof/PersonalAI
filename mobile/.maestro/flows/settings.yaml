appId: com.paigent.app
name: PersAI native settings navigation and saved limits
---
- launchApp:
    clearState: true
- runFlow: ../unlock.yaml
- tapOn: "Вкладка Настройки"
- extendedWaitUntil:
    visible: "Модели и подключения"
    timeout: 15000
- tapOn: "Модели и подключения"
- extendedWaitUntil:
    visible: "Добавить подключение"
    timeout: 15000
- takeScreenshot: native-model-connections
- back
- extendedWaitUntil:
    visible: "Модели и подключения"
    timeout: 15000
- scrollUntilVisible:
    element: "Развернуть: Работа ИИ"
    direction: DOWN
- tapOn: "Развернуть: Работа ИИ"
- scrollUntilVisible:
    element: "Лимит обращений к LLM на сообщение"
    direction: DOWN
- tapOn: "Лимит обращений к LLM на сообщение"
- eraseText
- inputText: "6"
- hideKeyboard
- scrollUntilVisible:
    element: "Сохранить лимит обращений к LLM"
    direction: DOWN
- tapOn: "Сохранить лимит обращений к LLM"
- assertVisible: "Лимит сохранён. Он действует для следующих сообщений."
- tapOn: "Вкладка Главная"
- tapOn: "Вкладка Настройки"
- runFlow:
    when:
      visible: "Развернуть: Работа ИИ"
    commands:
      - tapOn: "Развернуть: Работа ИИ"
- scrollUntilVisible:
    element: "Лимит обращений к LLM на сообщение"
    direction: DOWN
- assertVisible: "6"
- takeScreenshot: native-limit-persisted
