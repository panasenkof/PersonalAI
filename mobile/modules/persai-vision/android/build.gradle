plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.persai'
version = '0.1.0'

android {
  namespace 'expo.modules.persaivision'
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

// The Expo module is disabled in all regular builds (platforms: []).
// This compile-time-only stub is generated by the explicit Android CI gate.
// If someone enables autolinking without preparing the bridge, fail closed.
def visionApiStub = file('libs/vision-api.jar')
if (!visionApiStub.isFile()) {
  throw new GradleException('vision_expo_bridge_not_staged: do not enable this module before the opt-in gate')
}
dependencies {
  compileOnly files(visionApiStub)
  // The separately compiled Kotlin 2.4 engine and LiteRT dependencies are
  // packaged ONLY in the actual Android app under the opt-in gate.
  // No local .aar file dependency is introduced into an AAR-producing module.
}
